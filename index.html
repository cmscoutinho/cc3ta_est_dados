        }

        class Scope {
          constructor(parent) {
            this.parent = parent;
            this.vars = new Map();
          }
          lookup(name) {
            let s = this;
            while (s) {
              const v = s.vars.get(name);
              if (v) return v;
              s = s.parent;
            }
            return null;
          }
        }

        /* --------------------------- Interpretador ------------------------ */
        class Interp {
          constructor(opts) {
            opts = opts || {};
            this.maxSteps = opts.maxSteps || 10000000;
            this.maxOut = opts.maxOutput || 100000;
            this.maxDepth = opts.maxDepth || 900;
            this.out = [];
            this.outLen = 0;
            this.steps = 0;
            this.depth = 0;
            this.line = 0;
            this.classes = new Map();
            this.all = [];
            this.refCache = new Map();
            this.running = false;
          }
          emit(text, err) {
            if (this.outLen > this.maxOut) return;
            this.outLen += text.length;
            const last = this.out[this.out.length - 1];
            if (last && last.err === !!err) last.text += text;
            else this.out.push({ text, err: !!err });
            if (this.outLen > this.maxOut) {
              this.out.push({
                text: "\n[saída interrompida: limite de impressão excedido]\n",
                err: true,
              });
              throw new LimitError(
                "Limite de saída excedido (impressões demais — possível laço infinito).",
              );
            }
          }
          tick() {
            if (++this.steps > this.maxSteps)
              throw new LimitError(
                "Tempo de execução excedido: o programa executou instruções demais (possível laço infinito).",
              );
          }

          /* ---- carga de classes ---- */
          registerClass(d, outer, prelude) {
            const info = {
              name: d.name,
              decl: d,
              outer,
              superCls: null,
              methods: new Map(),
              ctors: d.ctors,
              fields: d.fields.filter((f) => !f.isStatic),
              staticMap: new Map(),
              statics: Object.create(null),
              isInterface: d.kind === "interface",
              isAbstract: d.isAbstract,
              prelude: !!prelude,
              inner: new Map(),
              fieldMap: null,
            };
            for (const f of d.fields)
              if (f.isStatic) info.staticMap.set(f.name, f);
            for (const m of d.methods) {
              m.owner = info;
              if (!info.methods.has(m.name)) info.methods.set(m.name, []);
              const list = info.methods.get(m.name);
              const sig = m.params.map((p) => typeStr(p.type)).join(",");
              if (
                !prelude &&
                list.some(
                  (o) => o.params.map((p) => typeStr(p.type)).join(",") === sig,
                )
              )
                throw CE(
                  `o método ${m.name}(${sig}) já foi definido na classe ${d.name}`,
                  m.line,
                );
              list.push(m);
            }
            for (const c of d.ctors) c.owner = info;
            const seen = new Set();
            for (const f of d.fields) {
              if (seen.has(f.name))
                throw CE(
                  `o atributo '${f.name}' já foi declarado na classe ${d.name}`,
                  f.line,
                );
              seen.add(f.name);
            }
            const ex = this.classes.get(d.name);
            if (outer) {
              outer.inner.set(d.name, info);
              if (!ex) this.classes.set(d.name, info);
            } else {
              if (ex && !ex.prelude && !ex.outer)
                throw CE(
                  `a classe ${d.name} foi declarada mais de uma vez`,
                  d.line,
                );
              this.classes.set(d.name, info);
            }
            this.all.push(info);
            for (const inner of d.inner)
              this.registerClass(inner, info, prelude);
            return info;
          }
          resolveClass(name, from) {
            for (let c = from; c; c = c.outer)
              for (let s = c; s; s = s.superCls) {
                const x = s.inner.get(name);
                if (x) return x;
                if (s.name === name) return s;
              }
            return this.classes.get(name) || null;
          }
          link() {
            for (const info of this.all) {
              const sn = info.decl.superName;
              if (sn) {
                const s = this.resolveClass(sn, info.outer);
                if (!s) {
                  if (FORBIDDEN.has(sn))
                    throw CE(forbiddenMsg(sn), info.decl.line);
                  if (sn === "Object") continue;
                  throw CE(`classe pai não encontrada: ${sn}`, info.decl.line);
                }
                if (s.isInterface)
                  throw CE(
                    `${sn} é uma interface: use 'implements' em vez de 'extends'`,
                    info.decl.line,
                  );
                info.superCls = s;
              }
            }
            for (const info of this.all) {
              let c = info.superCls,
                k = 0;
              while (c) {
                if (c === info || ++k > 200)
                  throw CE(
                    `herança cíclica envolvendo ${info.name}`,
                    info.decl.line,
                  );
                c = c.superCls;
              }
            }
            for (const info of this.all) this.fieldMapOf(info);
          }
          fieldMapOf(info) {
            if (info.fieldMap) return info.fieldMap;
            const m = new Map(
              info.superCls ? this.fieldMapOf(info.superCls) : undefined,
            );
            for (const f of info.fields)
              m.set(f.name, { decl: f, owner: info });
            info.fieldMap = m;
            return m;
          }
          topLevel(c) {
            while (c && c.outer) c = c.outer;
            return c;
          }
          canAccess(owner, isPrivate, from) {
            return (
              !isPrivate ||
              !from ||
              this.topLevel(owner) === this.topLevel(from)
            );
          }
          findStatic(cls, name) {
            for (let c = cls; c; c = c.outer) {
              for (let s = c; s; s = s.superCls) {
                const d = s.staticMap.get(name);
                if (d) return { info: s, decl: d };
                for (const iname of s.decl.interfaces) {
                  const ii = this.resolveClass(iname, s);
                  if (ii) {
                    const d2 = ii.staticMap.get(name);
                    if (d2) return { info: ii, decl: d2 };
                  }
                }
              }
            }
            return null;
          }
          isSubclassInfo(cls, target) {
            for (let c = cls; c; c = c.superCls) {
              if (c === target) return true;
              if (this.implementsName(c, target.name)) return true;
            }
            return false;
          }
          implementsName(c, name, depth) {
            if ((depth || 0) > 20) return false;
            for (const iname of c.decl.interfaces) {
              if (iname === name) return true;
              const ii = this.resolveClass(iname, c);
              if (ii && this.implementsName(ii, name, (depth || 0) + 1))
                return true;
            }
            return false;
          }
          isSubclassName(cls, name) {
            if (name === "Object") return true;
            for (let c = cls; c; c = c.superCls) {
              if (c.name === name) return true;
              if (this.implementsName(c, name)) return true;
            }
            return false;
          }
          classRef(info) {
            let r = this.refCache.get(info);
            if (!r) {
              r = new ClassRef(info);
              this.refCache.set(info, r);
            }
            return r;
          }

          defaultVal(type) {
            if (!type || type.dims > 0) return null;
            switch (type.name) {
              case "int":
              case "long":
              case "short":
              case "byte":
                return 0;
              case "double":
              case "float":
                return mkDouble(0);
              case "char":
                return mkChar(0);
              case "boolean":
                return false;
            }
            return null;
          }

          /* ---- verificação estática (simula erros de compilação) ---- */
          check() {
            for (const info of this.all)
              if (!info.prelude) this.checkClass(info);
          }
          checkClass(info) {
            const d = info.decl;
            const tp = new Set();
            for (let c = info; c; c = c.outer)
              for (const t of c.decl.typeParams) tp.add(t);
            for (const f of d.fields) {
              this.checkType(f.type, info, tp, f.line);
              if (f.init)
                this.cExpr(f.init, {
                  info,
                  isStatic: f.isStatic,
                  tp,
                  scopes: [new Set()],
                  method: null,
                });
            }
            if (!info.isAbstract && !info.prelude) {
              // métodos abstratos não implementados
              const need = new Map();
              const chain = [];
              for (let c = info; c; c = c.superCls) chain.push(c);
              for (const c of chain.slice().reverse()) {
                for (const [name, list] of c.methods)
                  for (const m of list) {
                    const key = name + "/" + m.params.length;
                    if (m.isAbstract) {
                      if (!need.has(key)) need.set(key, m);
                    } else need.delete(key);
                  }
              }
              if (need.size) {
                const m = need.values().next().value;
                throw CE(
                  `a classe ${info.name} não implementa o método abstrato ${m.name}(...)`,
                  d.line,
                );
              }
            }
            const all = [...d.methods, ...d.ctors];
            for (const m of all) {
              const mtp = new Set(tp);
              (m.typeParams || []).forEach((t) => mtp.add(t));
              if (m.retType) this.checkType(m.retType, info, mtp, m.line);
              const ps = new Set();
              for (const p of m.params) {
                this.checkType(p.type, info, mtp, m.line);
                if (ps.has(p.name))
                  throw CE(`parâmetro '${p.name}' repetido`, m.line);
                ps.add(p.name);
              }
              if (!m.body) continue;
              const ctx = {
                info,
                isStatic: !!m.isStatic,
                tp: mtp,
                scopes: [ps],
                method: m,
              };
              const body = m.body.body;
              for (let i = 0; i < body.length; i++) {
                const s = body[i];
                if (s.type === "ExprStmt" && s.expr.type === "CtorCall") {
                  if (!m.isCtor || i !== 0)
                    throw CE(
                      "chamadas this(...) ou super(...) só são permitidas como primeira instrução de um construtor",
                      s.line,
                    );
                  s.expr.args.forEach((a) => this.cExpr(a, ctx));
                  continue;
                }
                this.cStmt(s, ctx);
              }
            }
            for (const b of d.staticInits)
              this.cStmt(b, {
                info,
                isStatic: true,
                tp,
                scopes: [new Set()],
                method: null,
              });
            for (const b of d.instInits)
              this.cStmt(b, {
                info,
                isStatic: false,
                tp,
                scopes: [new Set()],
                method: null,
              });
          }
          checkType(type, info, tp, line) {
            if (type) this.checkTypeName(type.name, info, tp, line);
          }
          checkTypeName(name, info, tp, line) {
            if (PRIMS.has(name) || KNOWN_TYPES.has(name) || tp.has(name))
              return;
            if (this.resolveClass(name, info)) return;
            if (FORBIDDEN.has(name)) throw CE(forbiddenMsg(name), line);
            if (/^[A-Z]$/.test(name)) return;
            throw CE(`símbolo não encontrado: classe ou tipo '${name}'`, line);
          }
          declare(ctx, name, line) {
            for (const s of ctx.scopes)
              if (s.has(name))
                throw CE(
                  `a variável '${name}' já foi declarada neste método`,
                  line,
                );
            ctx.scopes[ctx.scopes.length - 1].add(name);
          }
          cSub(s, ctx) {
            if (!s) return;
            ctx.scopes.push(new Set());
            this.cStmt(s, ctx);
            ctx.scopes.pop();
          }
          cStmt(s, ctx) {
            switch (s.type) {
              case "Block":
                ctx.scopes.push(new Set());
                for (const x of s.body) this.cStmt(x, ctx);
                ctx.scopes.pop();
                return;
              case "LocalVar":
                for (const d of s.decls) {
                  this.checkType(d.type, ctx.info, ctx.tp, d.line);
                  if (d.init) this.cExpr(d.init, ctx);
                  this.declare(ctx, d.name, d.line);
                }
                return;
              case "ExprStmt":
                this.cExpr(s.expr, ctx);
                return;
              case "If":
                this.cExpr(s.cond, ctx);
                this.cSub(s.then, ctx);
                this.cSub(s.els, ctx);
                return;
              case "While":
              case "DoWhile":
                this.cExpr(s.cond, ctx);
                this.cSub(s.body, ctx);
                return;
              case "For":
                ctx.scopes.push(new Set());
                for (const i of s.init) this.cStmt(i, ctx);
                if (s.cond) this.cExpr(s.cond, ctx);
                for (const u of s.update) this.cExpr(u, ctx);
                this.cSub(s.body, ctx);
                ctx.scopes.pop();
                return;
              case "ForEach":
                this.cExpr(s.iter, ctx);
                ctx.scopes.push(new Set());
                this.checkType(s.varType, ctx.info, ctx.tp, s.line);
                this.declare(ctx, s.name, s.line);
                this.cSub(s.body, ctx);
                ctx.scopes.pop();
                return;
              case "Return": {
                const m = ctx.method;
                if (m) {
                  const isVoid =
                    m.isCtor || (m.retType && m.retType.name === "void");
                  if (isVoid && s.expr)
                    throw CE(
                      m.isCtor
                        ? "um construtor não pode retornar valor"
                        : `o método '${m.name}' é void e não pode retornar valor`,
                      s.line,
                    );
                  if (!isVoid && !s.expr)
                    throw CE(
                      `o método '${m.name}' deve retornar um valor do tipo ${typeStr(m.retType)}`,
                      s.line,
                    );
                }
                if (s.expr) this.cExpr(s.expr, ctx);
                return;
              }
              case "Throw":
                this.cExpr(s.expr, ctx);
                return;
              case "Try":
                this.cStmt(s.block, ctx);
                for (const c of s.catches) {
                  for (const t of c.types)
                    this.checkTypeName(t, ctx.info, ctx.tp, c.line);
                  ctx.scopes.push(new Set());
                  this.declare(ctx, c.name, c.line);
                  this.cStmt(c.body, ctx);
                  ctx.scopes.pop();
                }
                if (s.fin) this.cStmt(s.fin, ctx);
                return;
              case "Switch":
                this.cExpr(s.sel, ctx);
                ctx.scopes.push(new Set());
                for (const c of s.cases) {
                  for (const l of c.labels) this.cExpr(l, ctx);
                  for (const b of c.body) this.cStmt(b, ctx);
                }
                ctx.scopes.pop();
                return;
              default:
                return;
            }
          }
          cExpr(e, ctx) {
            switch (e.type) {
              case "Lit":
                return;
              case "Name":
                return this.cName(e, ctx);
              case "This":
                if (ctx.isStatic)
                  throw CE(
                    "'this' não pode ser usado dentro de um método static",
                    e.line,
                  );
                return;
              case "Field":
                return this.cExpr(e.obj, ctx);
              case "Index":
                this.cExpr(e.arr, ctx);
                this.cExpr(e.idx, ctx);
                return;
              case "Call":
                if (e.obj) this.cExpr(e.obj, ctx);
                else this.cUnqualCall(e, ctx);
                e.args.forEach((a) => this.cExpr(a, ctx));
                return;
              case "SuperCall":
                if (ctx.isStatic)
                  throw CE(
                    "'super' não pode ser usado dentro de um método static",
                    e.line,
                  );
                e.args.forEach((a) => this.cExpr(a, ctx));
                return;
              case "CtorCall":
                throw CE(
                  "chamadas this(...) ou super(...) só são permitidas como primeira instrução de um construtor",
                  e.line,
                );
              case "New":
                if (
                  ![
                    "StringBuilder",
                    "StringBuffer",
                    "String",
                    "Object",
                    "Integer",
                    "Double",
                    "Character",
                    "Boolean",
                    "Long",
                  ].includes(e.cls)
                ) {
                  const ci = this.resolveClass(e.cls, ctx.info);
                  if (!ci) {
                    if (FORBIDDEN.has(e.cls))
                      throw CE(forbiddenMsg(e.cls), e.line);
                    if (ctx.tp.has(e.cls))
                      throw CE(
                        `não é possível instanciar o tipo genérico ${e.cls}`,
                        e.line,
                      );
                    throw CE(
                      `símbolo não encontrado: classe '${e.cls}'`,
                      e.line,
                    );
                  }
                  if (ci.isInterface)
                    throw CE(
                      `${e.cls} é uma interface e não pode ser instanciada com new`,
                      e.line,
                    );
                  if (ci.isAbstract)
                    throw CE(
                      `${e.cls} é abstrata e não pode ser instanciada`,
                      e.line,
                    );
                }
                e.args.forEach((a) => this.cExpr(a, ctx));
                return;
              case "NewArray":
                this.checkTypeName(e.elem, ctx.info, ctx.tp, e.line);
                e.dimExprs.forEach((a) => this.cExpr(a, ctx));
                if (e.init) this.cExpr(e.init, ctx);
                return;
              case "ArrayInit":
                e.items.forEach((a) => this.cExpr(a, ctx));
                return;
              case "Assign":
              case "CompoundAssign":
                this.cExpr(e.target, ctx);
                this.cExpr(e.value, ctx);
                return;
              case "PreInc":
              case "PostInc":
                this.cExpr(e.target, ctx);
                return;
              case "Unary":
                this.cExpr(e.e, ctx);
                return;
              case "Bin":
                this.cExpr(e.l, ctx);
                this.cExpr(e.r, ctx);
                return;
              case "Cond":
                this.cExpr(e.cond, ctx);
                this.cExpr(e.a, ctx);
                this.cExpr(e.b, ctx);
                return;
              case "Cast":
                this.checkType(e.ty, ctx.info, ctx.tp, e.line);
                this.cExpr(e.e, ctx);
                return;
              case "InstanceOf":
                this.cExpr(e.expr, ctx);
                this.checkType(e.ty, ctx.info, ctx.tp, e.line);
                if (e.bind) {
                  const top = ctx.scopes[ctx.scopes.length - 1];
                  top.add(e.bind);
                }
                return;
            }
          }
          cName(e, ctx) {
            const n = e.name;
            for (const s of ctx.scopes) if (s.has(n)) return;
            let first = true;
            for (let c = ctx.info; c; c = c.outer) {
              const fm = this.fieldMapOf(c);
              if (fm.has(n)) {
                if (first && ctx.isStatic)
                  throw CE(
                    `o atributo '${n}' não é static e não pode ser usado dentro de um método static. Crie um objeto (ex.: new ${ctx.info.name}()) e acesse por ele, ou declare o atributo como static.`,
                    e.line,
                  );
                return;
              }
              for (let s = c; s; s = s.superCls) if (s.staticMap.has(n)) return;
              first = false;
            }
            if (this.findStatic(ctx.info, n)) return;
            if (this.resolveClass(n, ctx.info) || BUILTIN_NS.has(n)) return;
            if (FORBIDDEN.has(n)) throw CE(forbiddenMsg(n), e.line);
            if (n === "java" || n === "javax") return;
            throw CE(`símbolo não encontrado: variável '${n}'`, e.line);
          }
          cUnqualCall(e, ctx) {
            const n = e.name;
            let found = false,
              anyStatic = false,
              arityOk = false,
              anyInstHere = false;
            let first = true;
            for (let c = ctx.info; c; c = c.outer) {
              for (let s = c; s; s = s.superCls) {
                const ms = s.methods.get(n);
                if (ms)
                  for (const m of ms) {
                    found = true;
                    if (
                      m.params.length === e.args.length ||
                      (m.params.length && m.params[m.params.length - 1].varargs)
                    )
                      arityOk = true;
                    if (m.isStatic) anyStatic = true;
                    else if (first) anyInstHere = true;
                  }
              }
              first = false;
            }
            if (!found && OBJECT_METHODS.has(n)) {
              if (ctx.isStatic)
                throw CE(`o método '${n}()' não é static`, e.line);
              return;
            }
            if (!found) {
              if (BUILTIN_NS.has(n) || n === "println" || n === "print")
                throw CE(
                  `símbolo não encontrado: método '${n}(...)'. Para imprimir use System.out.${n === "print" ? "print" : "println"}(...)`,
                  e.line,
                );
              throw CE(
                `símbolo não encontrado: método '${n}(...)' na classe ${ctx.info.name}`,
                e.line,
              );
            }
            if (!arityOk)
              throw CE(
                `o método '${n}' não aceita ${e.args.length} argumento(s)`,
                e.line,
              );
            if (ctx.isStatic && !anyStatic && anyInstHere)
              throw CE(
                `o método '${n}(...)' não é static e não pode ser chamado diretamente de um método static (como o main). Crie um objeto e use objeto.${n}(...), ou declare o método como static.`,
                e.line,
              );
          }

          /* ---- inicialização ---- */
          initStatics() {
            for (const info of this.all)
              for (const [name, f] of info.staticMap)
                info.statics[name] = this.defaultVal(f.type);
            for (const info of this.all) {
              const frame = {
                thisObj: null,
                cls: info,
                scope: new Scope(null),
              };
              for (const [name, f] of info.staticMap)
                if (f.init)
                  info.statics[name] = this.coerce(
                    this.evalInit(f.init, frame),
                    f.type,
                    f.line,
                  );
              for (const b of info.decl.staticInits) this.exec(b, frame);
            }
          }
          evalInit(node, frame) {
            return node.type === "ArrayInit"
              ? this.buildArray(node, frame)
              : this.eval(node, frame);
          }

          /* ---- exceções Java ---- */
          makeThrow(clsName, msg, line) {
            const info =
              this.classes.get(clsName) || this.classes.get("RuntimeException");
            const o = new JObject(info);
            for (const [name, fi] of this.fieldMapOf(info))
              o.f[name] = this.defaultVal(fi.decl.type);
            o.f.message = msg === undefined ? null : msg;
            return new JavaThrow(o, line === undefined ? this.line : line);
          }
          throwJ(clsName, msg, line) {
            throw this.makeThrow(clsName, msg, line);
          }
          npe(msg, line) {
            this.throwJ("NullPointerException", msg, line);
          }
          qualName(cls) {
            if (cls.prelude) {
              if (JAVA_UTIL_EX.has(cls.name)) return "java.util." + cls.name;
              if (JAVA_IO_EX.has(cls.name)) return "java.io." + cls.name;
              return "java.lang." + cls.name;
            }
            return cls.name;
          }

          /* ---- coerção / conversão ---- */
          typeName(v) {
            if (v === null) return "null";
            if (v === undefined) return "void";
            if (typeof v === "number") return "int";
            if (typeof v === "boolean") return "boolean";
            if (typeof v === "string") return "String";
            if (v instanceof JDouble) return "double";
            if (v instanceof JChar) return "char";
            if (v instanceof JObject) return v.cls.name;
            if (v instanceof JArray) return v.et + "[]".repeat(v.dims);
            if (v instanceof JSB) return "StringBuilder";
            if (v instanceof ClassRef) return "classe " + v.info.name;
            return "?";
          }
          coerce(v, type, line, implicit) {
            if (!type) return v;
            if (v === undefined)
              throw CE(
                "um método void não retorna valor e não pode ser usado em uma expressão",
                line,
              );
            if (
              v instanceof ClassRef ||
              v instanceof NSRef ||
              v instanceof PkgRef
            )
              throw CE(

              case "Long":
              case "Short":

              case "Float":

          cast(v, ty, line) {

                  );

                    "ClassCastException",
                    `class ${this.typeName(v)} cannot be cast to class java.lang.${t}`,
                    line,
                  );
                }
                if (t === "Double" || t === "Float") {
                  if (v instanceof JDouble) return v;
                  this.throwJ(
                    "ClassCastException",
                    `class ${this.typeName(v)} cannot be cast to class java.lang.${t}`,
                    line,
                  );
                }

                  if (v instanceof JChar) return v;
                  this.throwJ(
                    "ClassCastException",
                    `class ${this.typeName(v)} cannot be cast to class java.lang.Character`,
                    line,
                  );

                    "ClassCastException",
                    `class ${this.typeName(v)} cannot be cast to class java.lang.Boolean`,
                    line,
                  );

                  ci &&
                  v instanceof JObject &&

                    "ClassCastException",
                    `class ${v.cls.name} cannot be cast to class ${t}`,

          toStr(v) {

              case "number":

              case "boolean":

                "um método void não retorna valor e não pode ser usado em uma expressão",
                this.line,
              );

            if (v instanceof JChar) return String.fromCharCode(v.c);

            if (v instanceof JObject) {
              const m = this.findMethod(v.cls, "toString", []);

        UI.sha256 = function (str) {
          const bytes = new TextEncoder().encode(str);
          const K = [
            0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b,
            0x59f111f1, 0x923f82a4, 0xab1c5ed5, 0xd807aa98, 0x12835b01,

            0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da, 0x983e5152,

            0x06ca6351, 0x14292967, 0x27b70a85, 0x2e1b2138, 0x4d2c6dfc,
            0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
            0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819,
            0xd6990624, 0xf40e3585, 0x106aa070, 0x19a4c116, 0x1e376c08,
            0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f,
            0x682e6ff3, 0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208,
            0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2,
          ];
          const H = [
            0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f,
            0x9b05688c, 0x1f83d9ab, 0x5be0cd19,
          ];
          const l = bytes.length,
            nb = ((l + 9 + 63) >> 6) << 6;
          const m = new Uint8Array(nb);
          m.set(bytes);
          m[l] = 0x80;
          const bits = l * 8;
          const dv = new DataView(m.buffer);
          dv.setUint32(nb - 4, bits >>> 0);
          dv.setUint32(nb - 8, Math.floor(bits / 0x100000000));
          const w = new Uint32Array(64);
          const rotr = (x, n) => (x >>> n) | (x << (32 - n));
          for (let o = 0; o < nb; o += 64) {
            for (let i = 0; i < 16; i++) w[i] = dv.getUint32(o + i * 4);
            for (let i = 16; i < 64; i++) {
              const s0 =
                rotr(w[i - 15], 7) ^ rotr(w[i - 15], 18) ^ (w[i - 15] >>> 3);
              const s1 =
                rotr(w[i - 2], 17) ^ rotr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
              w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
            }
            let [a, b, c, d, e, f, g, h] = H;
            for (let i = 0; i < 64; i++) {
              const S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25),
                ch = (e & f) ^ (~e & g);
              const t1 = (h + S1 + ch + K[i] + w[i]) | 0;
              const S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22),
                mj = (a & b) ^ (a & c) ^ (b & c);
              const t2 = (S0 + mj) | 0;
              h = g;
              g = f;
              f = e;
              e = (d + t1) | 0;
              d = c;
              c = b;
              b = a;
              a = (t1 + t2) | 0;
            }
            H[0] = (H[0] + a) | 0;
            H[1] = (H[1] + b) | 0;
            H[2] = (H[2] + c) | 0;
            H[3] = (H[3] + d) | 0;
            H[4] = (H[4] + e) | 0;
            H[5] = (H[5] + f) | 0;
            H[6] = (H[6] + g) | 0;
            H[7] = (H[7] + h) | 0;
          }
          return H.map((x) => (x >>> 0).toString(16).padStart(8, "0")).join("");
        };

        const CLASSE_PILHA = `class PilhaLista {
    private No topo;
    private int tamanho;

    public PilhaLista() {
        topo = null;
        tamanho = 0;
    }

    public void push(int valor) {
        No novo = new No(valor);
        novo.proximo = topo;
        topo = novo;
        tamanho++;
    }

    public int pop() {
        if (isEmpty()) {
            throw new IllegalStateException("Erro! Pilha vazia.");
        }
        int valor = topo.valor;
        topo = topo.proximo;
        tamanho--;
        return valor;
    }

    public int peek() {
        if (isEmpty()) {
            throw new IllegalStateException("Erro! Pilha vazia.");
        }
        return topo.valor;
    }

    public boolean isEmpty() {
        return topo == null;
    }

    public int size() {
        return tamanho;
    }

    // Mostra do topo para a base. Exemplo: topo [40, 30, 10] base
    public String toString() {
        StringBuilder sb = new StringBuilder("topo [");
        No atual = topo;
        while (atual != null) {
            sb.append(atual.valor);
            if (atual.proximo != null) sb.append(", ");
            atual = atual.proximo;
        }
        return sb.append("] base").toString();
    }
}`;

        const CLASSE_FILA = `class FilaLista {
    private No inicio;
    private No fim;
    private int tamanho;

    public FilaLista() {
        inicio = null;
        fim = null;
        tamanho = 0;
    }

    public void enqueue(int valor) {
        No novo = new No(valor);
        if (isEmpty()) {
            inicio = novo;
            fim = novo;
        } else {
            fim.proximo = novo;
            fim = novo;
        }
        tamanho++;
    }

    public int dequeue() {
        if (isEmpty()) {
            throw new IllegalStateException("Erro! Fila vazia.");
        }
        int valor = inicio.valor;
        inicio = inicio.proximo;
        tamanho--;
        if (inicio == null) {
            fim = null;
        }
        return valor;
    }

    public int peek() {
        if (isEmpty()) {
            throw new IllegalStateException("Erro! Fila vazia.");
        }
        return inicio.valor;
    }

    public boolean isEmpty() {
        return inicio == null;
    }

    public int size() {
        return tamanho;
    }

    // Mostra do início para o fim. Exemplo: inicio [1, 2, 3] fim
    public String toString() {
        StringBuilder sb = new StringBuilder("inicio [");
        No atual = inicio;
        while (atual != null) {
            sb.append(atual.valor);
            if (atual.proximo != null) sb.append(", ");
            atual = atual.proximo;
        }
        return sb.append("] fim").toString();
    }
}`;

            const n = $("#net");

            n.innerHTML = ok
              ? '<span class="dot ok"></span>Conectado ao servidor de envio.'
              : '<span class="dot bad"></span>Sem conexão com o servidor agora. Você pode fazer a prova normalmente, mas precisará de internet para enviar ao final.';
          });
        const f = $("#fstart");
        if (!f) return;
        const iv = setInterval(() => {
          const el = $("#falta");
          if (!el) {
            clearInterval(iv);
            return;
          }
          el.textContent = fmtClock(restante());
          if (restante() <= 0) {
            clearInterval(iv);
            renderStart();
          }
        }, 1000);
        f.onsubmit = (e) => {
          e.preventDefault();
          const nome = f.nome.value.trim().replace(/\s+/g, " ");
          const matricula = f.matricula.value.trim().replace(/\s+/g, "");
          if (nome.split(" ").length < 2) {
            $("#ferr").textContent =
              "Informe o nome completo (nome e sobrenome).";
            return;
          }
          if (!/^[A-Za-z0-9.\-_/]{3,}$/.test(matricula)) {
            $("#ferr").textContent =
              "Informe uma matrícula válida (somente letras e números).";
            return;
          }
          if (restante() <= 0) {
            renderStart();
            return;
          }
          clearInterval(iv);
          iniciar({
            nome,
            matricula,
            turma: f.turma.value.trim() || CONFIG.turma,
          });
        };
      }

      function iniciar(aluno) {
        const now = Date.now();
        const ordem = {};
        for (const q of Q)
          if (q.tipo === "objetiva")
            ordem[q.id] = shuffle(
              q.alternativas.map((a) => a.id),
              hashStr(aluno.matricula + "|" + q.id + "|" + CONFIG.idProva),
            );
        const respostas = {},
          rascunhos = {};
        for (const q of Q) {
          rascunhos[q.id] = "";
          if (q.tipo === "objetiva") respostas[q.id] = { opcao: null };
          else if (q.tipo === "discursiva") respostas[q.id] = { texto: "" };
          else
            respostas[q.id] = {
              codigo: q.template,
              execucoes: 0,
              testes: null,
              ultimaSaida: null,
            };
        }
        S = {
          versao: VERSAO,
          prova: CONFIG.idProva,
          aluno,
          inicioMs: now,
          decorrido: 0,
          ultimoRelogio: now,
          offset: offsetServidor,
          atual: 0,
          respostas,
          rascunhos,
          ordem,
          revisar: {},
          eventos: [],
          finalizada: false,
        };
        log("inicio", navigator.userAgent);
        if (offsetServidor)
          log(
            "relogio-ajustado",
            `relógio local difere do servidor em ${Math.round(offsetServidor / 1000)} s`,
          );
        save(true);
        if (CONFIG.pedirTelaCheia) requestFS();
        renderExam();
      }

      /* ---------------- retomada ---------------- */
      function renderResume(saved) {
        app.innerHTML = `
  <div class="splash"><div class="card" style="max-width:580px">
    <div class="card-head"><img class="logo" src="${UI.LOGO_FULL}" alt="CESUPA"><div><div class="inst">${esc(CONFIG.disciplina)}</div><h1>Prova em andamento</h1></div></div>
    <div style="padding:24px 30px 28px">
      <p>Existe uma prova em andamento neste computador:</p>
      <p style="font-size:1.05rem"><strong>${esc(saved.aluno.nome)}</strong> · matrícula ${esc(saved.aluno.matricula)}</p>
      <p class="small">Iniciada em ${UI.fmtDataHora(saved.inicioMs)}. Prazo final: ${prazoTxt()}.</p>
      <div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap">
        <button class="btn primary lg" id="bcont">Continuar esta prova</button>
        <button class="btn ghost" id="bother">Não sou eu</button>
      </div>
    </div>
  </div></div>`;
        $("#bcont").onclick = () => {
          S = saved;
          S.rascunhos = S.rascunhos || {};
          if (Date.now() < S.ultimoRelogio - 60000)
            log("relogio-irregular", "o relógio do computador voltou no tempo");
          S.ultimoRelogio = Math.max(S.ultimoRelogio, Date.now() - 1);
          log("retomada", "página reaberta");
          pingServidor();
          if (CONFIG.pedirTelaCheia) requestFS();
          if (restante() <= 0) {
            finalizar("prazo-esgotado");
            return;
          }
          renderExam();
        };
        $("#bother").onclick = () => {
          modal(
            `<h2>Outra pessoa?</h2><p>Se você não é <strong>${esc(saved.aluno.nome)}</strong>, chame o professor. Iniciar uma nova prova aqui apaga a prova em andamento deste computador.</p>`,
            [
              { label: "Voltar", cls: "" },
              {
                label: "Apagar e iniciar nova",
                cls: "danger",
                fn: () => {
                  UI.storage.del(KEY);
                  renderStart();
                },
              },
            ],
          );
        };
      }

      /* ---------------- prova ---------------- */
      function renderExam() {
        app.innerHTML = `
  <header class="top">
    <div class="brand"><div class="logobox"><img src="${UI.LOGO_COMPACT}" alt="CESUPA"></div><div><div class="t1">${esc(CONFIG.disciplina)}</div><div class="t2">Avaliação · Turma ${esc(S.aluno.turma)}</div></div></div>
    <div class="who"><b>${esc(S.aluno.nome)}</b>Matrícula ${esc(S.aluno.matricula)}</div>
    <div class="timerbox"><span class="timer" id="timer" title="Tempo restante até o prazo">--:--</span><small>prazo ${prazoHora()}</small></div>
    <div class="saved" id="saved">Salvo</div>
    <button class="btn accent" id="bfin">Finalizar prova</button>
  </header>
  <div class="layout">
    <nav class="rail" id="rail"></nav>
    <main class="qmain" id="qmain"></main>
  </div>
  <div id="fsbanner" hidden><span>Você saiu do modo tela cheia (registrado).</span><button class="btn sm" id="bfs">Voltar à tela cheia</button></div>`;
        $("#bfin").onclick = confirmarFinal;
        $("#bfs").onclick = requestFS;
        renderRail();
        renderQuestion();
        startTick();
      }
      function renderRail() {
        const rail = $("#rail");
        if (!rail) return;
        const n = Q.filter(respondida).length;
        rail.innerHTML =
          `<h3>Questões</h3>` +
          Q.map(
            (q, i) => `
    <button class="qbtn ${i === S.atual ? "on" : ""} ${respondida(q) ? "done" : ""}" data-i="${i}" title="${esc(q.titulo)}">
      <span class="num">${q.numero}</span>
      <span class="lb">${esc(q.titulo)}<small>${tipoLabel(q)} · ${UI.fmtNota(q.pontos)} pt</small></span>
      <span class="flag">${S.revisar[q.id] ? "⚑" : ""}</span>
    </button>`,
          ).join("") +
          `<div class="progress">${n} de ${Q.length} respondidas<div class="bar"><i style="width:${(n / Q.length) * 100}%"></i></div>
     <div class="events-note" id="evnote"></div></div>`;
        $$(".qbtn", rail).forEach(
          (b) => (b.onclick = () => goto(+b.dataset.i)),
        );
        updateEvNote();
      }
      function updateEvNote() {
        const el = $("#evnote");
        if (!el) return;
        const s = S.eventos.filter((e) => e.tipo === "saiu-da-janela").length;
        el.textContent = s ? `Saídas da janela registradas: ${s}` : "";
      }
      function goto(i) {
        if (i < 0 || i >= Q.length) return;
        S.atual = i;
        save();
        renderRail();
        renderQuestion();
        $("#qmain").scrollTop = 0;
      }

      function qHead(q) {
        return `<div class="qhead">
    <div><div class="meta">Questão ${q.numero} · ${tipoLabel(q)} · ${ptLabel(q.pontos)} · ${esc(q.tema)}</div><h2>${esc(q.titulo)}</h2></div>
    <div class="right"><button class="btn sm ${S.revisar[q.id] ? "accent" : ""}" id="brev">${S.revisar[q.id] ? "⚑ Marcada para revisão" : "⚐ Marcar para revisão"}</button></div>
  </div>`;
      }
      function rascunhoHtml(q) {
        return `<section class="rasc"><div class="rasc-h">✎ Rascunho <span>espaço livre · não é corrigido · salvo automaticamente</span></div>
    <textarea id="rasc" spellcheck="false" placeholder="Use para anotar, simular a pilha/fila passo a passo, esboçar código...">${esc(S.rascunhos[q.id] || "")}</textarea></section>`;
      }
      function bindRascunho(q) {
        const ta = $("#rasc");
        if (!ta) return;
        ta.oninput = () => {
          S.rascunhos[q.id] = ta.value;
          save();
        };
        ta.addEventListener("keydown", (e) => {
          if (e.key === "Tab") {
            e.preventDefault();
            ta.setRangeText("    ", ta.selectionStart, ta.selectionEnd, "end");
            S.rascunhos[q.id] = ta.value;
            save();
          }
        });
        guardPaste(ta, q.id + "-rascunho");
      }
      function navHtml() {
        const i = S.atual;
        return `<button class="btn" id="bprev" ${i === 0 ? "disabled" : ""}>← Anterior</button>
          ${i < Q.length - 1 ? '<button class="btn dark" id="bnext">Próxima →</button>' : '<button class="btn accent" id="bnext2">Revisar e finalizar</button>'}`;
      }
      function bindNav() {
        const p = $("#bprev"),
          n = $("#bnext"),
          n2 = $("#bnext2");
        if (p) p.onclick = () => goto(S.atual - 1);
        if (n) n.onclick = () => goto(S.atual + 1);
        if (n2) n2.onclick = confirmarFinal;
        $("#brev").onclick = () => {
          const q = Q[S.atual];
          S.revisar[q.id] = !S.revisar[q.id];
          save();
          renderRail();
          renderQuestion();
        };
      }
      function renderQuestion() {
        const q = Q[S.atual],
          m = $("#qmain");
        const r = S.respostas[q.id];
        if (q.tipo === "objetiva") {
          const ordem = S.ordem[q.id];
          m.innerHTML =
            `<div class="qwrap">` +
            qHead(q) +
            `<div class="qcard"><div class="qtext">${q.enunciado}</div>
      <div class="opts" role="radiogroup">${ordem
        .map((id, k) => {
          const a = q.alternativas.find((x) => x.id === id);
          return `<label class="opt ${r.opcao === id ? "sel" : ""}"><input type="radio" name="op" value="${id}" ${r.opcao === id ? "checked" : ""}><span class="let">${LETRAS[k]}</span><div>${a.html}</div></label>`;
        })
        .join("")}</div>
      ${r.opcao ? '<button class="btn sm ghost clear" id="bclear">Limpar resposta</button>' : ""}
    </div>${rascunhoHtml(q)}<div class="qnav">${navHtml()}</div></div>`;
          $$(".opt input", m).forEach(
            (inp) =>
              (inp.onchange = () => {
                r.opcao = inp.value;
                r.letra = LETRAS[ordem.indexOf(inp.value)];
                r.quando = Date.now();
                save();
                renderRail();
                renderQuestion();
              }),
          );
          const bc = $("#bclear");
          if (bc)
            bc.onclick = () => {
              r.opcao = null;
              r.letra = null;
              save();
              renderRail();
              renderQuestion();
            };
        } else if (q.tipo === "discursiva") {
          m.innerHTML =
            `<div class="qwrap">` +
            qHead(q) +
            `<div class="qcard"><div class="qtext">${q.enunciado}</div>
      <div class="disc"><textarea id="disc" placeholder="${esc(q.placeholder || "")}" spellcheck="true">${esc(r.texto)}</textarea><div class="cnt" id="cnt"></div></div>
    </div>${rascunhoHtml(q)}<div class="qnav">${navHtml()}</div></div>`;
          const ta = $("#disc");
          const cnt = () => {
            const t = ta.value.trim();
            $("#cnt").textContent =
              `${t ? t.split(/\s+/).length : 0} palavras · ${ta.value.length} caracteres`;
          };
          cnt();
          let wasDone = respondida(q);
          ta.oninput = () => {
            r.texto = ta.value;
            cnt();
            save();
            const d = respondida(q);
            if (d !== wasDone) {
              wasDone = d;
              renderRail();
            }
          };
          guardPaste(ta, q.id);
        } else {
          m.innerHTML = `<div class="qwrap">${qHead(q)}
      <div class="qcard"><div class="qtext">${q.enunciado}</div>
        <details class="help"><summary>Sobre o ambiente Java desta prova</summary>
          <ul>
            <li>O código é executado por um interpretador Java didático, dentro do navegador e sem internet.</li>
            <li>Suporta classes, nós, construtores, herança, interfaces, genéricos, exceções, <code>String</code>, <code>StringBuilder</code>, arrays e <code>Math</code>.</li>
            <li>Não estão disponíveis: coleções de <code>java.util</code>, <code>Scanner</code>, lambdas, <code>enum</code> e classes anônimas.</li>
            <li>Ao digitar <code>(</code>, <code>[</code> ou <code>{</code> o fechamento é inserido automaticamente.</li>
            <li>Atalhos: <span class="kbd">Ctrl</span>+<span class="kbd">Enter</span> executa · <span class="kbd">Tab</span> indenta · <span class="kbd">Ctrl</span>+<span class="kbd">/</span> comenta linhas.</li>
          </ul>
        </details>
      </div>
      <div class="work">
        <div class="toolbar">
          <button class="btn primary" id="brun">▶ Executar</button>
          <button class="btn" id="btest">✓ Testar exemplos (${q.testesPublicos.length})</button>
          <span class="hint">Ctrl+Enter executa</span>
          <span class="sp"></span>
          <button class="btn sm ghost" id="breset" title="Volta ao código inicial da questão">↺ Restaurar modelo</button>
        </div>
        <div id="editor"></div>
        <div>
          <div class="outtabs"><button data-t="console" class="on">Console</button><button data-t="tests">Testes</button></div>
          <div class="outpanel"><div class="console" id="console"><div class="placeholder">Clique em “Executar” para compilar e rodar o método main, ou em “Testar exemplos” para rodar os casos de teste.</div></div><div class="tests" id="tests" hidden></div></div>
        </div>
      </div>
      ${rascunhoHtml(q)}
      <div class="qnav">${navHtml()}</div></div>`;
          let wasDone = respondida(q);
          const ed = UI.createEditor($("#editor"), {
            value: r.codigo,
            onChange: (v) => {
              r.codigo = v;
              save();
              const d = respondida(q);
              if (d !== wasDone) {
                wasDone = d;
                renderRail();
              }
            },
            onRun: () => runMain(q),
          });
          editors[q.id] = ed;
          guardPaste(ed.ta, q.id);
          $("#brun").onclick = () => runMain(q);
          $("#btest").onclick = () => runPublicTests(q);
          $("#breset").onclick = () =>
            modal(
              "<h2>Restaurar o modelo?</h2><p>Seu código desta questão será substituído pelo código inicial. Esta ação não pode ser desfeita.</p>",
              [
                { label: "Cancelar" },
                {
                  label: "Restaurar",
                  cls: "danger",
                  fn: () => {
                    ed.value = q.template;
                    r.codigo = q.template;
                    log("restaurou-modelo", q.id);
                    save();
                    renderRail();
                  },
                },
              ],
            );
          $$(".outtabs button").forEach(
            (b) => (b.onclick = () => showTab(b.dataset.t)),
          );
          const cache = runCache[q.id];
          if (cache && cache.tab === "tests" && cache.tests) {
            UI.renderTests($("#tests"), cache.tests, { codes: codesOf(q) });
            showTab("tests");
          } else if (cache && cache.run)
            UI.renderRun($("#console"), cache.run, (n) => ed.gotoLine(n));
        }
        bindRascunho(q);
        UI.highlightBlocks(m);
        bindNav();
      }
      const codesOf = (q) =>
        Object.fromEntries(q.testesPublicos.map((t) => [t.id, t.codigo]));
      function showTab(t) {
        $$(".outtabs button").forEach((b) =>
          b.classList.toggle("on", b.dataset.t === t),
        );
        $("#console").hidden = t !== "console";
        $("#tests").hidden = t !== "tests";
      }
      function runMain(q) {
        const ed = editors[q.id],
          r = S.respostas[q.id];
        showTab("console");
        $("#console").innerHTML =
          '<div class="placeholder">Compilando e executando…</div>';
        setTimeout(() => {
          const res = JavaInterp.run(ed.value, {
            maxSteps: 20000000,
            maxOutput: 60000,
          });
          UI.renderRun($("#console"), res, (n) => ed.gotoLine(n));
          if (
            res.error &&
            res.error.line &&
            (res.error.kind === "compile" || res.error.kind === "semantic")
          )
            ed.setErrorLine(res.error.line);
          runCache[q.id] = { run: res, tab: "console" };
          r.execucoes = (r.execucoes || 0) + 1;
          r.ultimaSaida = {
            quando: Date.now(),
            ok: !res.error,
            erro: res.error ? res.error.message.slice(0, 300) : null,
            saida: res.stdout.slice(0, 2000),
          };
          log(
            "execucao",
            q.id + (res.error ? " · " + res.error.kind : " · ok"),
          );
        }, 30);
      }
      function runPublicTests(q) {
        const ed = editors[q.id],
          r = S.respostas[q.id];
        showTab("tests");
        $("#tests").innerHTML =
          '<div class="placeholder" style="color:var(--muted)">Executando testes…</div>';
        setTimeout(() => {
          const comp = JavaInterp.compile(ed.value);
          if (!comp.ok) {
            $("#tests").innerHTML =
              `<div class="tsum"><strong>0/${q.testesPublicos.length}</strong> — o código não compila: ${esc(comp.error.message)} (linha ${comp.error.line})</div>`;
            ed.setErrorLine(comp.error.line);
            r.testes = {
              ok: 0,
              total: q.testesPublicos.length,
              quando: Date.now(),
            };
            log("testes", q.id + " · não compila");
            return;
          }
          const res = UI.runTests(ed.value, q.testesPublicos);
          UI.renderTests($("#tests"), res, { codes: codesOf(q) });
          runCache[q.id] = { tests: res, tab: "tests" };
          const ok = res.filter((x) => x.ok).length;
          r.testes = { ok, total: res.length, quando: Date.now() };
          log("testes", `${q.id} · ${ok}/${res.length}`);
        }, 30);
      }

      /* ---------------- colar / copiar ---------------- */
      document.addEventListener("copy", () => {
        const s = selectedText();
        if (s) internalClips.add(norm(s));
      });
      document.addEventListener("cut", () => {
        const s = selectedText();
        if (s) internalClips.add(norm(s));
      });
      function selectedText() {
        const a = document.activeElement;
        if (a && (a.tagName === "TEXTAREA" || a.tagName === "INPUT"))
          return a.value.slice(a.selectionStart, a.selectionEnd);
        return String(window.getSelection() || "");
      }
      const norm = (s) => s.replace(/\r/g, "").trim();
      function guardPaste(el, qid) {
        el.addEventListener("paste", (e) => {
          if (!CONFIG.bloquearColar) return;
          const t =
            (e.clipboardData || window.clipboardData).getData("text") || "";
          if (!t || internalClips.has(norm(t))) return;
          e.preventDefault();
          log("colar-bloqueado", `${qid} · ${t.length} caracteres`);
          UI.toast(
            "Colar conteúdo de fora da prova não é permitido. A tentativa foi registrada.",
            "warn",
          );
        });
        el.addEventListener("drop", (e) => {
          if (CONFIG.bloquearColar) {
            e.preventDefault();
            log("arrastar-bloqueado", qid);
          }
        });
      }

      /* ---------------- monitoramento ---------------- */
      let hiddenAt = 0,
        blurAt = 0;
      document.addEventListener("visibilitychange", () => {
        if (!S || S.finalizada || !$("#timer")) return;
        if (document.hidden) {
          hiddenAt = Date.now();
          log("aba-oculta");
        } else if (hiddenAt) {
          log(
            "aba-visivel",
            `ausente por ${Math.round((Date.now() - hiddenAt) / 1000)} s`,
          );
          hiddenAt = 0;
        }
      });
      window.addEventListener("blur", () => {
        if (!S || S.finalizada || !$("#timer")) return;
        blurAt = Date.now();
        log("saiu-da-janela");
        updateEvNote();
      });
      window.addEventListener("focus", () => {
        if (!S || S.finalizada || !$("#timer") || !blurAt) return;
        const secs = Math.round((Date.now() - blurAt) / 1000);
        blurAt = 0;
        log("voltou-a-janela", `ausente por ${secs} s`);
        const n = S.eventos.filter((e) => e.tipo === "saiu-da-janela").length;
        UI.toast(`Saída da janela da prova registrada (${n}).`, "warn");
      });
      document.addEventListener("fullscreenchange", () => {
        if (!S || S.finalizada) return;
        const fs = !!document.fullscreenElement;
        log(fs ? "entrou-tela-cheia" : "saiu-tela-cheia");
        const b = $("#fsbanner");
        if (b && CONFIG.pedirTelaCheia) b.hidden = fs;
      });
      function requestFS() {
        try {
          const p =
            document.documentElement.requestFullscreen &&
            document.documentElement.requestFullscreen();
          if (p && p.catch) p.catch(() => {});
        } catch (_) {}
      }
      window.addEventListener("beforeunload", (e) => {
        if (S && !S.finalizada) {
          save(true);
          e.preventDefault();
          e.returnValue = "";
        } else if (S && S.finalizada && S.envio && S.envio.status !== "ok") {
          e.preventDefault();
          e.returnValue = "";
        }
      });

      function startTick() {
        clearInterval(tickTimer);
        lastPerf = performance.now();
        const avisos = { 15: false, 5: false, 1: false };
        let n = 0;
        const tick = () => {
          if (!S || S.finalizada) return;
          const p = performance.now(),
            dp = p - lastPerf;
          lastPerf = p;
          const now = Date.now(),
            dw = now - S.ultimoRelogio;
          S.decorrido += dp;
          S.ultimoRelogio = now;
          if (Math.abs(dw - dp) > 30000)
            log(
              "relogio-irregular",
              `diferença de ${Math.round((dw - dp) / 1000)} s`,
            );
          const rem = restante();
          const t = $("#timer");
          if (t) {
            t.textContent = fmtClock(rem);
            t.classList.toggle("warn", rem < 900000 && rem >= 300000);
            t.classList.toggle("danger", rem < 300000);
          }
          for (const min of [15, 5, 1])
            if (!avisos[min] && rem < min * 60000 && rem > 0) {
              avisos[min] = true;
              if (rem > (min - 1) * 60000 + 30000)
                UI.toast(
                  min === 1
                    ? "Falta 1 minuto! A prova será finalizada e enviada automaticamente."
                    : `Faltam ${min} minutos para o prazo final (${prazoHora()}).`,
                  min === 15 ? "warn" : "bad",
                  8000,
                );
            }
          if (rem <= 0) {
            finalizar("prazo-esgotado");
            return;
          }
          if (++n % 5 === 0) save(true);
          if (n % 600 === 0) pingServidor();
        };
        tick();
        tickTimer = setInterval(tick, 1000);
      }

      /* ---------------- finalização ---------------- */
      function modal(html, actions) {
        const bg = h(
          `<div class="modal-bg"><div class="modal">${html}<div class="actions"></div></div></div>`,
        );
        const act = $(".actions", bg);
        for (const a of actions) {
          const b = h(
            `<button class="btn ${a.cls || ""}">${esc(a.label)}</button>`,
          );
          b.onclick = () => {
            bg.remove();
            a.fn && a.fn();
          };
          act.appendChild(b);
        }
        document.body.appendChild(bg);
        const last = act.lastElementChild;
        if (last) last.focus();
        return bg;
      }
      function confirmarFinal() {
        const pend = Q.filter((q) => !respondida(q));
        const rev = Q.filter((q) => S.revisar[q.id]);
        let html =
          `<h2>Finalizar a prova?</h2><p>Depois de finalizar não será possível alterar as respostas. ${ENVIO_ON ? "A prova será enviada ao professor pela internet." : ""}</p><ul class="qmini">` +
          Q.map(
            (q) =>
              `<li><span class="n">${q.numero}</span><span>${esc(q.titulo)}</span><span class="tp">${respondida(q) ? '<span class="pill ok">respondida</span>' : '<span class="pill bad">em branco</span>'}${S.revisar[q.id] ? ' <span class="pill warn">⚑ revisar</span>' : ""}</span></li>`,
          ).join("") +
          "</ul>";
        if (pend.length)
          html += `<p class="warnbox" style="margin-top:14px">Você tem ${pend.length} questão(ões) sem resposta.</p>`;
        else if (rev.length)
          html += `<p class="warnbox" style="margin-top:14px">Há questões marcadas para revisão.</p>`;
        modal(html, [
          { label: "Continuar a prova" },
          {
            label: ENVIO_ON
              ? "Finalizar e enviar"
              : "Finalizar e gerar arquivo",
            cls: "accent",
            fn: () => finalizar("manual"),
          },
        ]);
      }
      function buildEntrega() {
        const fim = S.fimMs || agora();
        const respostas = {};
        for (const q of Q) {
          const r = S.respostas[q.id];
          if (q.tipo === "objetiva")
            respostas[q.id] = {
              opcao: r.opcao || null,
              letraExibida: r.letra || null,
            };
          else if (q.tipo === "discursiva")
            respostas[q.id] = { texto: r.texto };
          else
            respostas[q.id] = {
              codigo: r.codigo,
              modificado: r.codigo.trim() !== q.template.trim(),
              execucoes: r.execucoes || 0,
              testesPublicos: r.testes || null,
              ultimaExecucao: r.ultimaSaida || null,
            };
        }
        const cnt = (t) => S.eventos.filter((e) => e.tipo === t).length;
        const payload = {
          formato: "cesupa-ed-prova/1",
          versaoPlataforma: VERSAO,
          prova: CONFIG.idProva,
          disciplina: CONFIG.disciplina,
          professor: CONFIG.professor,
          aluno: S.aluno,
          inicio: new Date(S.inicioMs + (S.offset || 0)).toISOString(),
          fim: new Date(fim).toISOString(),
          prazo: new Date(PRAZO).toISOString(),
          minutosUtilizados:
            Math.round((fim - S.inicioMs - (S.offset || 0)) / 600) / 100,
          finalizacao: S.finalizacao,
          ordemAlternativas: S.ordem,
          respostas,
          rascunhos: S.rascunhos || {},
          resumoEventos: {
            saidasDaJanela: cnt("saiu-da-janela"),
            abaOculta: cnt("aba-oculta"),
            saidasTelaCheia: cnt("saiu-tela-cheia"),
            colagensBloqueadas:
              cnt("colar-bloqueado") + cnt("arrastar-bloqueado"),
            retomadas: cnt("retomada"),
            relogioIrregular:
              cnt("relogio-irregular") + cnt("relogio-ajustado"),
          },
          eventos: S.eventos,
          navegador: navigator.userAgent,
        };
        payload.selo = UI.selo(payload);
        return payload;
      }
      function nomeArquivo() {
        return `ED_${UI.slug(CONFIG.idProva)}_${UI.slug(S.aluno.matricula)}_${UI.slug(S.aluno.nome)}.json`;
      }
      function finalizar(tipo) {
        if (S.finalizada) {
          renderDone();
          return;
        }
        S.finalizacao = tipo;
        S.fimMs = agora();
        log("finalizacao", tipo);
        S.finalizada = true;
        S.entrega = buildEntrega();
        S.envio = {
          status: ENVIO_ON ? "pendente" : "sem-servidor",
          tentativas: 0,
        };
        save(true);
        const all = UI.storage.get(KEY_ENTREGAS) || {};
        all[S.aluno.matricula] = S.entrega;
        UI.storage.set(KEY_ENTREGAS, all);
        clearInterval(tickTimer);
        if (document.fullscreenElement)
          document.exitFullscreen().catch(() => {});
        renderDone();
        if (tipo === "prazo-esgotado")
          UI.toast(
            "O prazo terminou. Sua prova foi finalizada automaticamente.",
            "warn",
            8000,
          );
        if (ENVIO_ON) enviar();
        else baixar();
      }
      async function enviar() {
        if (enviando || !ENVIO_ON) return;
        enviando = true;
        clearTimeout(retryTimer);
        S.envio.status = "enviando";
        S.envio.tentativas = (S.envio.tentativas || 0) + 1;
        renderSend();
        const r = await UI.enviarEntrega(CONFIG.urlEnvio, S.entrega);
        enviando = false;
        if (r.ok) {
          S.envio = {
            status: "ok",
            recebidoEm: r.recebidoEm || new Date().toISOString(),
            tentativas: S.envio.tentativas,
          };
        } else {
          S.envio.status = "erro";
          S.envio.erro = r.erro;
          if (S.envio.tentativas === 1) baixar();
          retryTimer = setTimeout(enviar, 30000);
        }
        save(true);
        renderSend();
      }
      function baixar() {
        UI.download(nomeArquivo(), JSON.stringify(S.entrega, null, 2));
      }
      function renderSend() {
        const box = $("#sendbox");
        if (!box) return;
        const ev = S.envio || {};
        const card = $(".done");
        if (card) card.classList.toggle("pend", ENVIO_ON && ev.status !== "ok");
        const icon = $("#bigicon");
        if (icon)
          icon.textContent = !ENVIO_ON || ev.status === "ok" ? "✓" : "…";
        const ttl = $("#donetitle");
        if (ttl)
          ttl.textContent = !ENVIO_ON
            ? "Prova finalizada"
            : ev.status === "ok"
              ? "Prova enviada com sucesso"
              : "Prova finalizada — envio pendente";
        if (!ENVIO_ON) {
          box.className = "sendbox wait";
          box.innerHTML =
            "Entregue o arquivo de respostas ao professor conforme orientado em sala.";
          return;
        }
        if (ev.status === "ok") {
          box.className = "sendbox ok";
          box.innerHTML = `<span>✓ <strong>Recebida pelo servidor</strong> em ${UI.fmtDataHora(Date.parse(ev.recebidoEm))}. Você já pode fechar esta página.</span>`;
        } else if (ev.status === "enviando" || ev.status === "pendente") {
          box.className = "sendbox wait";
          box.innerHTML = `<span><span class="dot wait" style="display:inline-block;margin-right:6px"></span>Enviando sua prova ao professor… não feche esta página.</span>`;
        } else {
          box.className = "sendbox err";
          box.innerHTML = `<span>✗ <strong>Ainda não foi possível enviar.</strong> ${esc(ev.erro || "")} Verifique a internet. Nova tentativa automática em 30 s (tentativa ${ev.tentativas}).</span><button class="btn sm" id="bretry">Tentar agora</button>`;
          $("#bretry").onclick = enviar;
          const a = $("#alt");
          if (a) a.open = true;
        }
      }
      function renderDone() {
        const E = S.entrega;
        const backup = UI.BACKUP_PREFIX + UI.b64enc(JSON.stringify(E));
        const fname = nomeArquivo();
        const assunto = `[${CONFIG.disciplina}] Prova ${CONFIG.idProva} - ${S.aluno.nome} (${S.aluno.matricula})`;
        const corpo = `Professor,\n\nSegue em anexo o arquivo da minha prova: ${fname}\nSelo de verificação: ${UI.codigoCurto(E.selo)}\n\n${S.aluno.nome}\nMatrícula ${S.aluno.matricula}\n\n(ATENÇÃO: anexe o arquivo baixado antes de enviar)`;
        const mail = CONFIG.emailProfessor
          ? `mailto:${encodeURIComponent(CONFIG.emailProfessor)}?subject=${encodeURIComponent(assunto)}&body=${encodeURIComponent(corpo)}`
          : "";
        const alternativas = `
      <div class="step"><div class="sn">${ENVIO_ON ? "A" : 1}</div><div>
        <h3>${ENVIO_ON ? "Cópia do arquivo de respostas" : "Guarde o arquivo de respostas"}</h3>
        <p>${ENVIO_ON ? "Se o envio pela internet falhar, entregue este arquivo ao professor (e-mail, Teams/AVA ou pen drive)." : `O download do arquivo <strong>${esc(fname)}</strong> começou automaticamente.`}</p>
        <button class="btn ${ENVIO_ON ? "" : "primary"}" id="bdl">⬇ Baixar arquivo de respostas</button>
        ${mail ? ` <a class="btn dark" href="${mail}">✉ Abrir e-mail para o professor</a>` : ""}
      </div></div>
      <div class="step"><div class="sn">${ENVIO_ON ? "B" : 2}</div><div>
        <h3>Código de resposta</h3>
        <p>Outra alternativa: copie o código abaixo e envie em uma mensagem ao professor. Ele contém a prova completa.</p>
        <textarea class="backup" readonly id="bk">${esc(backup)}</textarea>
        <button class="btn sm" id="bcopy" style="margin-top:6px">Copiar código</button>
      </div></div>`;
        app.innerHTML = `
  <div class="splash"><div class="card done">
    <div class="card-head"><div class="bigicon" id="bigicon">✓</div><div>
      <div class="inst">${esc(CONFIG.disciplina)} · ${esc(CONFIG.idProva)}</div>
      <h1 id="donetitle">Prova finalizada</h1>
      <div class="sub">${esc(S.aluno.nome)} · matrícula ${esc(S.aluno.matricula)} · finalizada em ${UI.fmtDataHora(Date.parse(E.fim))}${E.finalizacao === "prazo-esgotado" ? " (prazo esgotado)" : ""}</div>
      <div style="margin-top:6px">Selo de verificação: <span class="selo">${UI.codigoCurto(E.selo)}</span></div>
    </div></div>
    <div class="steps">
      <div class="sendbox" id="sendbox"></div>
      ${ENVIO_ON ? `<details class="alt" id="alt"><summary>Alternativas de entrega (use somente se o envio falhar)</summary><div class="steps" style="padding:0">${alternativas}</div></details>` : alternativas}
      <p class="small">Uma cópia da entrega também ficou salva neste navegador. <button class="link" id="bnew" style="font-weight:500">Iniciar sessão para outro aluno</button></p>
    </div>
  </div></div>`;
        $("#bdl").onclick = baixar;
        $("#bcopy").onclick = async () => {
          const ok = await UI.copy(backup);
          UI.toast(
            ok
              ? "Código copiado."
              : "Não foi possível copiar; selecione o texto manualmente.",
            ok ? "ok" : "warn",
          );
        };
        $("#bk").onfocus = (e) => e.target.select();
        $("#bnew").onclick = () =>
          modal(
            `<h2>Nova sessão</h2><p>Isto prepara o computador para outro aluno. ${S.envio && S.envio.status !== "ok" && ENVIO_ON ? "<strong>Atenção: esta prova ainda não foi enviada.</strong> " : ""}A entrega atual continua salva neste navegador.</p>`,
            [
              { label: "Cancelar" },
              {
                label: "Iniciar nova sessão",
                cls: "danger",
                fn: () => {
                  clearTimeout(retryTimer);
                  UI.storage.del(KEY);
                  S = null;
                  renderStart();
                },
              },
            ],
          );
        renderSend();
        if (ENVIO_ON && S.envio && S.envio.status === "erro") {
          const a = $("#alt");
          if (a) a.open = true;
        }
      }

      /* ---------------- início ---------------- */
      (function boot() {
        const saved = UI.storage.get(KEY);
        if (saved && saved.prova === CONFIG.idProva && saved.aluno) {
          if (saved.finalizada) {
            S = saved;
            S.envio = S.envio || {
              status: ENVIO_ON ? "pendente" : "sem-servidor",
              tentativas: 0,
            };
            renderDone();
            if (ENVIO_ON && S.envio.status !== "ok") enviar();
            return;
          }
          renderResume(saved);
          return;
        }
        renderStart();
      })();
    </script>
  </body>
</html>
