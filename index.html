    <style>
      :root {
        --navy: #0c2b4b;
        --navy-2: #143e66;
        --blue: #0a7fb5;
        --blue-soft: #e3f1f8;
        --accent: #e59a2f;
        --accent-soft: #fdf1df;
        --bg: #f2f5f8;
        --card: #ffffff;
        --line: #dbe3ec;
        --line-2: #e9eef3;
        --text: #16212c;
        --muted: #5a6877;
        --faint: #8c99a6;
        --ok: #1d7f48;
        --ok-soft: #e3f4ea;
        --bad: #b93535;
        --bad-soft: #fbe7e7;
        --warn: #a46a12;
        --warn-soft: #fff4dd;
        --code-bg: #24272b;
        --code-fg: #c9d2db;
        --code-line: #33373c;
        --radius: 10px;
        --mono:
          "JetBrains Mono", "Cascadia Code", "Fira Code", Consolas, "SF Mono",
          Menlo, "DejaVu Sans Mono", monospace;
        --sans:
          "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial,
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        font-family: var(--sans);
        color: var(--text);
        background: var(--bg);
        font-size: 15px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
        color: inherit;
      }
      code {
        font-family: var(--mono);
        font-size: 0.9em;
        background: #eef2f6;
        border: 1px solid #e1e7ee;
        padding: 0.05em 0.35em;
        border-radius: 4px;
      }
      h1,
      h2,
      h3 {
        line-height: 1.25;
        margin: 0;
      }
      a {
        color: var(--blue);
      }

      /* botões */
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.45em;
        border: 1px solid var(--line);
        background: #fff;
        padding: 0.5em 0.95em;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.92rem;
        transition:
          background 0.12s,
          border-color 0.12s,
          transform 0.05s;
        white-space: nowrap;
      }
      .btn:hover {
        background: #f5f8fb;
        border-color: #c9d4df;
      }
      .btn:active {
        transform: translateY(1px);
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn.primary {
        background: var(--blue);
        border-color: var(--blue);
        color: #fff;
      }
      .btn.primary:hover {
        background: #08709f;
      }
      .btn.dark {
        background: var(--navy);
        border-color: var(--navy);
        color: #fff;
      }
      .btn.dark:hover {
        background: var(--navy-2);
      }
      .btn.accent {
        background: var(--accent);
        border-color: var(--accent);
        color: #2a1a00;
      }
      .btn.accent:hover {
        background: #d88b1f;
      }
      .btn.ghost {
        background: transparent;
        border-color: transparent;
      }
      .btn.ghost:hover {
        background: rgba(0, 0, 0, 0.05);
      }
      .btn.danger {
        color: var(--bad);
      }
      .btn.sm {
        padding: 0.3em 0.65em;
        font-size: 0.84rem;
      }
      .btn.lg {
        padding: 0.75em 1.4em;
        font-size: 1rem;
      }
      button.link {
        background: none;
        border: 0;
        padding: 0;
        color: var(--blue);
        text-decoration: underline;
        cursor: pointer;
        font-weight: 600;
      }
      .kbd {
        font-family: var(--mono);
        font-size: 0.78em;
        border: 1px solid var(--line);
        border-bottom-width: 2px;
        border-radius: 4px;
        padding: 0 0.35em;
        background: #fff;
        color: var(--muted);
      }

      /* blocos de código (enunciados) */
      pre.code-block,
      pre[data-java] {
        font-family: var(--mono);
        font-size: 0.86rem;
        line-height: 1.6;
        background: var(--code-bg);
        color: var(--code-fg);
        padding: 14px 16px;
        border-radius: 8px;
        overflow-x: auto;
        margin: 0.8em 0;
        tab-size: 4;
      }
      .tk-kw {
        color: #e0894a;
      }
      .tk-str {
        color: #8fb573;
      }
      .tk-num {
        color: #7fa8d6;
      }
      .tk-com {
        color: #7c8792;
        font-style: italic;
      }
      .tk-fn {
        color: #f1cb72;
      }
      .tk-type {
        color: #e6edf3;
      }
      .tk-ann {
        color: #b7b36a;
      }

      /* editor */
      .ed {
        display: flex;
        background: var(--code-bg);
        border-radius: 8px;
        overflow: hidden;
        font-family: var(--mono);
        font-size: 13.5px;
        line-height: 21px;
        position: relative;
        min-height: 200px;
      }
      .ed-gutter {
        width: 46px;
        flex: none;
        background: #1d2023;
        color: #5d6670;
        text-align: right;
        overflow: hidden;
        user-select: none;
        border-right: 1px solid var(--code-line);
      }
      .ed-lines {
        padding: 12px 8px 12px 0;
        will-change: transform;
      }
      .ed-lines .err {
        color: #fff;
        background: #a83a3a;
        border-radius: 3px 0 0 3px;
      }
      .ed-main {
        position: relative;
        flex: 1;
        min-width: 0;
      }
      .ed-hl,
      .ed-ta {
        position: absolute;
        inset: 0;
        margin: 0;
        padding: 12px 14px;
        border: 0;
        font: inherit;
        line-height: inherit;
        white-space: pre;
        tab-size: 4;
        letter-spacing: 0;
        font-variant-ligatures: none;
        overflow: hidden;
      }
      .ed-hl {
        color: var(--code-fg);
        pointer-events: none;
      }
      .ed-hl code {
        font: inherit;
        background: none;
        border: 0;
        padding: 0;
        color: inherit;
      }
      .ed-ta {
        background: transparent;
        color: transparent;
        caret-color: #f5f5f5;
        resize: none;
        outline: none;
        overflow: auto;
        -webkit-text-fill-color: transparent;
      }
      .ed-ta::selection {
        background: rgba(110, 160, 230, 0.35);
        -webkit-text-fill-color: transparent;
      }
      .ed-ta[readonly] {
        caret-color: transparent;
      }

      /* console */
      .console {
        background: #15181b;
        color: #d5dde4;
        border-radius: 8px;
        font-family: var(--mono);
        font-size: 12.8px;
        min-height: 64px;
        max-height: 280px;
        overflow: auto;
        padding: 10px 12px;
      }
      .console pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        font: inherit;
      }
      .console .cerr {
        color: #ff8c8c;
      }
      .console .cmuted {
        color: #7c8792;
        font-style: italic;
      }
      .console .cerrbox {
        margin-top: 6px;
        border-left: 3px solid #e05a5a;
        padding: 4px 10px;
        color: #ffb4b4;
        background: rgba(224, 90, 90, 0.08);
        border-radius: 0 6px 6px 0;
        white-space: pre-wrap;
      }
      .console .cerrbox strong {
        color: #ffd0d0;
        display: block;
      }
      .console .cerrbox button.link {
        color: #9cd0ff;
      }
      .console .cmeta {
        margin-top: 8px;
        color: #6f7a85;
        font-size: 11.5px;
        font-family: var(--sans);
      }
      .console .placeholder {
        color: #6f7a85;
        font-family: var(--sans);
        font-size: 13px;
      }

      /* testes */
      .tsum {
        font-size: 0.9rem;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .tsum strong {
        color: var(--bad);
        font-size: 1.05rem;
      }
      .tsum.all strong {
        color: var(--ok);
      }
      .tlist {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 6px;
      }
      .tlist li {
        display: flex;
        gap: 10px;
        padding: 8px 10px;
        border-radius: 8px;
        background: var(--card);
        border: 1px solid var(--line-2);
        font-size: 0.88rem;
      }
      .tlist li.ok .tic {
        color: var(--ok);
      }
      .tlist li.no .tic {
        color: var(--bad);
      }
      .tlist li.no {
        border-color: #f0caca;
        background: #fffafa;
      }
      .tic {
        font-weight: 800;
        width: 1em;
        flex: none;
      }
      .tname {
        font-weight: 600;
      }
      .tdet {
        color: var(--muted);
        font-size: 0.84rem;
        margin-top: 2px;
        word-break: break-word;
      }
      .tdet span {
        color: var(--faint);
      }
      .tcode summary {
        cursor: pointer;
        color: var(--blue);
        font-size: 0.8rem;
      }
      .tcode pre {
        font-size: 0.78rem;
        margin: 0.4em 0 0;
      }

      /* avisos */
      #toasts {
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        display: grid;
        gap: 8px;
        z-index: 9999;
        pointer-events: none;
      }
      .toast {
        background: var(--navy);
        color: #fff;
        padding: 0.7em 1.1em;
        border-radius: 10px;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.25);
        font-size: 0.92rem;
        max-width: 92vw;
        animation: tin 0.2s ease-out;
      }
      .toast.warn {
        background: #8a5a0e;
      }
      .toast.bad {
        background: #9b2c2c;
      }
      .toast.ok {
        background: #19683c;
      }
      .toast.out {
        opacity: 0;
        transform: translateY(6px);
        transition: 0.3s;
      }
      @keyframes tin {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
      }

      .modal-bg {
        position: fixed;
        inset: 0;
        background: rgba(9, 22, 36, 0.55);
        display: grid;
        place-items: center;
        z-index: 1000;
        padding: 16px;
        backdrop-filter: blur(2px);
      }
      .modal {
        background: #fff;
        border-radius: 14px;
        max-width: 560px;
        width: 100%;
        padding: 24px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        max-height: 92vh;
        overflow: auto;
      }
      .modal h2 {
        font-size: 1.25rem;
        margin-bottom: 0.5em;
      }
      .modal .actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 18px;
        flex-wrap: wrap;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 0.35em;
        font-size: 0.78rem;
        font-weight: 700;
        padding: 0.15em 0.6em;
        border-radius: 99px;
        background: var(--line-2);
        color: var(--muted);
        white-space: nowrap;
      }
      .pill.ok {
        background: var(--ok-soft);
        color: var(--ok);
      }
      .pill.bad {
        background: var(--bad-soft);
        color: var(--bad);
      }
      .pill.warn {
        background: var(--warn-soft);
        color: var(--warn);
      }
      .pill.blue {
        background: var(--blue-soft);
        color: var(--blue);
      }

      table.exemplos {
        border-collapse: collapse;
        margin: 0.6em 0 1em;
        font-size: 0.9rem;
      }
      table.exemplos th,
      table.exemplos td {
        border: 1px solid var(--line);
        padding: 0.35em 0.8em;
        text-align: left;
      }
      table.exemplos th {
        background: #f4f7fa;
        font-weight: 600;
      }
      .nota {
        font-size: 0.88rem;
        color: var(--muted);
        background: var(--accent-soft);
        border-left: 3px solid var(--accent);
        padding: 0.5em 0.8em;
        border-radius: 0 6px 6px 0;
      }

      /* ---------- tela inicial ---------- */
      .splash {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px 16px;
        background:
          radial-gradient(
            1200px 500px at 85% -10%,
            rgba(10, 127, 181, 0.2),
            transparent 60%
          ),
          linear-gradient(
            180deg,
            var(--navy) 0,
            var(--navy) 300px,
            var(--bg) 300px
          );
      }
      .card {
        background: var(--card);
        border-radius: 16px;
        box-shadow: 0 18px 50px rgba(12, 43, 75, 0.18);
        width: 100%;
        max-width: 880px;
        overflow: hidden;
      }
      .card-head {
        padding: 24px 30px 22px;
        border-bottom: 1px solid var(--line-2);
        display: flex;
        gap: 22px;
        align-items: center;
      }
      .card-head .logo {
        height: 64px;
        width: auto;
        flex: none;
      }
      .card-head .inst {
        font-size: 0.76rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        font-weight: 700;
      }
      .card-head h1 {
        font-size: 1.55rem;
        margin-top: 2px;
      }
      .card-head .sub {
        color: var(--muted);
        font-size: 0.95rem;
      }
      .card-body {
        display: grid;
        grid-template-columns: 1.1fr 1fr;
      }
      .card-body > section {
        padding: 24px 30px 28px;
      }
      .card-body > section + section {
        border-left: 1px solid var(--line-2);
        background: #fbfcfd;
      }
      .facts {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-bottom: 18px;
      }
      .fact {
        background: var(--bg);
        border-radius: 10px;
        padding: 10px 12px;
      }
      .fact b {
        display: block;
        font-size: 1.2rem;
        color: var(--navy);
      }
      .fact span {
        font-size: 0.78rem;
        color: var(--muted);
      }
      .rules {
        margin: 0;
        padding-left: 1.1em;
        color: #2b3a48;
        font-size: 0.92rem;
      }
      .rules li {
        margin: 0.35em 0;
      }
      .qmini {
        list-style: none;
        padding: 0;
        margin: 14px 0 0;
        display: grid;
        gap: 6px;
        font-size: 0.88rem;
      }
      .qmini li {
        display: flex;
        gap: 10px;
        align-items: baseline;
      }
      .qmini .n {
        font-weight: 800;
        color: var(--blue);
        width: 1.5em;
        flex: none;
      }
      .qmini .tp {
        margin-left: auto;
        color: var(--faint);
        font-size: 0.8rem;
        white-space: nowrap;
      }
      label.field {
        display: block;
        margin-bottom: 14px;
      }
      label.field span {
        display: block;
        font-size: 0.82rem;
        font-weight: 700;
        color: #33414f;
        margin-bottom: 5px;
      }
      label.field input {
        width: 100%;
        padding: 0.65em 0.8em;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        font-size: 1rem;
      }
      label.field input:focus,
      textarea:focus {
        outline: 3px solid rgba(10, 127, 181, 0.22);
        border-color: var(--blue);
      }
      .check {
        display: flex;
        gap: 10px;
        align-items: flex-start;

      }

  <body>
    <div id="app"></div>
    <script>
      /* =====================================================================
   Interpretador Java didático — executa um subconjunto de Java 100%
   no navegador, sem rede. Suporta: classes (aninhadas, herança,
   interfaces, genéricos ignorados no runtime), construtores, static,
   atributos, métodos com sobrecarga, int/long/double/char/boolean,
   String, StringBuilder, arrays, if/else, while, do-while, for,

   ===================================================================== */
      (function (root) {
        "use strict";

        /* ---------------------------- Valores ---------------------------- */
        class JDouble {
          constructor(v) {
            this.v = v;
          }
        }
        class JChar {
          constructor(c) {

          }
        }
        const CHARS = [];
        function mkChar(c) {
          c = c & 0xffff;
          if (c < 256) return CHARS[c] || (CHARS[c] = new JChar(c));
          return new JChar(c);
        }
        function mkDouble(v) {
          return new JDouble(v);
        }
        let NEXT_ID = 1;
        class JObject {
          constructor(cls) {
            this.cls = cls;
            this.f = Object.create(null);
            this.id = NEXT_ID++;
            this.outerThis = null;
          }
        }
        class JArray {
          constructor(et, dims, a) {
            this.et = et;
            this.dims = dims;
            this.a = a;
            this.id = NEXT_ID++;
          }
        }
        class JSB {
          constructor(s) {
            this.s = s;
            this.id = NEXT_ID++;
          }
        }
        class ClassRef {
          constructor(info) {
            this.info = info;
          }
        }
        class NSRef {
          constructor(name) {
            this.name = name;
          }
        }
        class PkgRef {
          constructor(path) {
            this.path = path;
          }
        }
        class ClassObj {
          constructor(name, qual) {
            this.name = name;
            this.qual = qual;
            this.id = NEXT_ID++;
          }
        }
        const UNINIT = { uninit: true };

        class CompileError extends Error {
          constructor(msg, line) {
            super(msg);
            this.line = line;
          }
        }
        class LimitError extends Error {
          constructor(msg) {
            super(msg);
          }
        }
        class JavaThrow {
          constructor(obj, line) {
            this.obj = obj;
            this.line = line;
          }
        }
        class ExitSignal {
          constructor(code) {
            this.code = code;
          }
        }

        const CE = (m, l) => new CompileError(m, l);

        const PRIMS = new Set([
          "int",
          "long",
          "short",
          "byte",
          "double",
          "float",
          "char",
          "boolean",
        ]);
        const BUILTIN_NS = new Set([
          "System",
          "Math",

          "Long",

          "Boolean",
          "String",

        ]);
        const KNOWN_TYPES = new Set([
          "String",
          "Object",
          "Integer",
          "Long",
          "Double",
          "Float",
          "Short",
          "Byte",
          "Character",
          "Boolean",
          "StringBuilder",
          "StringBuffer",
          "CharSequence",
          "Comparable",

          "Number",
          "Runnable",
          "Cloneable",
          "Math",
          "System",
          "Arrays",
          "Objects",
          "var",
          "void",
        ]);
        const FORBIDDEN = new Set([
          "ArrayList",
          "LinkedList",
          "List",
          "Stack",
          "Queue",
          "Deque",
          "ArrayDeque",
          "PriorityQueue",
          "HashMap",
          "Map",
          "HashSet",
          "Set",
          "TreeMap",
          "TreeSet",
          "Vector",
          "Collections",
          "Collection",
          "Iterator",
          "LinkedHashMap",
          "LinkedHashSet",
          "Scanner",
          "Random",
          "Optional",
          "Stream",
          "Collectors",
          "BufferedReader",
          "InputStreamReader",
        ]);
        const OBJECT_METHODS = new Set([
          "toString",
          "equals",
          "hashCode",
          "getClass",
        ]);
        const JAVA_UTIL_EX = new Set([
          "NoSuchElementException",
          "EmptyStackException",
          "IllegalFormatConversionException",
          "InputMismatchException",
          "ConcurrentModificationException",
        ]);
        const JAVA_IO_EX = new Set(["IOException"]);

        function forbiddenMsg(n) {
          if (
            n === "Scanner" ||
            n === "BufferedReader" ||
            n === "InputStreamReader"
          )
            return `Leitura de entrada (${n}) não está disponível neste ambiente. Use valores fixos no main.`;

          return `A classe '${n}' (java.util) não pode ser usada nesta prova. Implemente a estrutura com nós (suas próprias classes).`;
        }
        function typeStr(t) {
          return t ? t.name + "[]".repeat(t.dims || 0) : "?";
        }
        function isDigit(c) {
          return c >= "0" && c <= "9";
        }

        /* ----------------------------- Lexer ----------------------------- */
        const KEYWORDS = new Set(
          "abstract assert boolean break byte case catch char class const continue default do double else enum extends final finally float for goto if implements import instanceof int interface long native new package private protected public return short static strictfp super switch synchronized this throw throws transient try void volatile while true false null".split(
            " ",
          ),
        );
        const OPS = [
          ">>>=",
          "<<=",
          ">>=",
          ">>>",
          "...",
          "->",
          "::",
          "++",
          "--",
          "&&",

          "==",

          "<=",
          ">=",
          "+=",
          "-=",

          "%=",

          "|=",
          "^=",

          "(",
          ")",
          "[",
          "]",
          "{",
          "}",
          "&",
          "|",
          "^",
          "@",

        function lex(src) {
          const toks = [];
          let i = 0,
            line = 1;
          const n = src.length;
          const err = (m) => {
            throw CE(m, line);
          };
          function readEscape() {
            const e = src[i + 1];
            const map = {
              n: 10,
              t: 9,
              r: 13,
              b: 8,
              f: 12,
              s: 32,
              "'": 39,
              '"': 34,
              "\\": 92,
            };
            if (e === "u") {
              let k = i + 1;
              while (src[k] === "u") k++;
              const hex = src.slice(k, k + 4);
              if (!/^[0-9a-fA-F]{4}$/.test(hex))
                err("sequência de escape unicode inválida");
              i = k + 4;
              return parseInt(hex, 16);
            }
            if (e >= "0" && e <= "7") {
              let k = i + 1,
                s = "";
              while (s.length < 3 && src[k] >= "0" && src[k] <= "7")
                s += src[k++];
              i = k;
              return parseInt(s, 8);
            }
            if (e in map) {
              i += 2;
              return map[e];
            }
            err(
              "sequência de escape inválida: \\" + (e === undefined ? "" : e),
            );
          }
          while (i < n) {
            const ch = src[i];
            if (ch === "\n") {
              line++;
              i++;
              continue;
            }
            if (
              ch === " " ||
              ch === "\t" ||
              ch === "\r" ||
              ch === "\f" ||
              ch === " " ||
              ch === "﻿"
            ) {
              i++;
              continue;
            }
            if (ch === "/" && src[i + 1] === "/") {
              while (i < n && src[i] !== "\n") i++;
              continue;
            }
            if (ch === "/" && src[i + 1] === "*") {
              const startLine = line;
              i += 2;
              while (i < n && !(src[i] === "*" && src[i + 1] === "/")) {
                if (src[i] === "\n") line++;
                i++;
              }
              if (i >= n) throw CE("comentário /* não foi fechado", startLine);
              i += 2;
              continue;
            }
            if (
              /[A-Za-z_$]/.test(ch) ||
              (ch.charCodeAt(0) > 127 && /\p{L}/u.test(ch))
            ) {
              let j = i + 1;
              while (
                j < n &&
                (/[A-Za-z0-9_$]/.test(src[j]) ||
                  (src.charCodeAt(j) > 127 && /[\p{L}\p{N}]/u.test(src[j])))
              )
                j++;
              const w = src.slice(i, j);
              toks.push({ t: KEYWORDS.has(w) ? "kw" : "id", v: w, line });
              i = j;
              continue;
            }
            if (isDigit(ch) || (ch === "." && isDigit(src[i + 1] || ""))) {
              let j = i,
                isF = false;
              if (
                ch === "0" &&
                (src[i + 1] === "x" ||
                  src[i + 1] === "X" ||
                  src[i + 1] === "b" ||
                  src[i + 1] === "B")
              ) {
                const hex = src[i + 1] === "x" || src[i + 1] === "X";
                j = i + 2;
                while (j < n && (hex ? /[0-9a-fA-F_]/ : /[01_]/).test(src[j]))
                  j++;
                let v = parseInt(
                  src.slice(i + 2, j).replace(/_/g, ""),
                  hex ? 16 : 2,
                );
                if (src[j] === "l" || src[j] === "L") j++;
                else v = v | 0;
                toks.push({ t: "int", v, line });
                i = j;
                continue;
              }
              while (j < n && (isDigit(src[j]) || src[j] === "_")) j++;
              if (src[j] === "." && isDigit(src[j + 1] || "")) {
                isF = true;
                j++;
                while (j < n && (isDigit(src[j]) || src[j] === "_")) j++;
              } else if (
                src[j] === "." &&
                !/[A-Za-z_$.]/.test(src[j + 1] || "")
              ) {
                isF = true;
                j++;
              }
              if (src[j] === "e" || src[j] === "E") {
                let k = j + 1;
                if (src[k] === "+" || src[k] === "-") k++;
                if (isDigit(src[k] || "")) {
                  isF = true;
                  j = k;
                  while (j < n && isDigit(src[j])) j++;
                }
              }
              const text = src.slice(i, j).replace(/_/g, "");
              if (
                src[j] === "f" ||
                src[j] === "F" ||
                src[j] === "d" ||
                src[j] === "D"
              ) {
                isF = true;
                j++;
              } else if (!isF && (src[j] === "l" || src[j] === "L")) {
                j++;
                toks.push({ t: "int", v: Number(text), line, long: true });
                i = j;
                continue;
              }
              if (/[A-Za-z_$]/.test(src[j] || ""))
                err(`número malformado: ${src.slice(i, j + 1)}`);
              if (isF) toks.push({ t: "double", v: parseFloat(text), line });
              else {
                const v2 =
                  text.length > 1 && text[0] === "0"
                    ? parseInt(text, 8)
                    : Number(text);
                if (v2 > 2147483648)
                  err(
                    `número inteiro grande demais para int: ${text} (para long, use o sufixo L)`,
                  );
                toks.push({ t: "int", v: v2, line });
              }
              i = j;
              continue;
            }
            if (ch === '"') {
              if (src.startsWith('"""', i))
                err('text blocks (""") não são suportados');
              i++;
              let s = "";
              for (;;) {
                if (i >= n || src[i] === "\n")
                  err('string não foi fechada (faltou ")');
                if (src[i] === '"') {
                  i++;
                  break;
                }
                if (src[i] === "\\") s += String.fromCharCode(readEscape());
                else {
                  s += src[i];
                  i++;
                }
              }
              toks.push({ t: "str", v: s, line });
              continue;
            }
            if (ch === "'") {
              i++;
              let c;
              if (src[i] === "'") err("literal de caractere vazio ('')");
              if (src[i] === "\n" || i >= n)
                err("literal de caractere não fechado");
              if (src[i] === "\\") c = readEscape();
              else {
                c = src.charCodeAt(i);
                i++;
              }
              if (src[i] !== "'")
                err(
                  "literal de caractere não fechado ou com mais de um caractere (use aspas duplas para String)",
                );
              i++;
              toks.push({ t: "char", v: c, line });
              continue;
            }
            let m = null;
            for (const op of OPS)
              if (src.startsWith(op, i)) {
                m = op;
                break;
              }
            if (!m) err(`caractere inesperado '${ch}'`);
            toks.push({ t: "op", v: m, line });
            i += m.length;
          }
          toks.push({ t: "eof", v: "<fim>", line });
          return toks;
        }

        /* ----------------------------- Parser ---------------------------- */
        const MODS = new Set([
          "public",
          "private",
          "protected",
          "static",
          "final",
          "abstract",
          "synchronized",
          "transient",
          "volatile",
          "native",
          "strictfp",
          "default",
        ]);
        const ASSIGN_OPS = new Set([
          "=",
          "+=",
          "-=",
          "*=",
          "/=",
          "%=",
          "&=",
          "|=",
          "^=",
          "<<=",
          ">>=",
          ">>>=",
        ]);
        const BIN_PREC = {
          "||": 1,
          "&&": 2,
          "|": 3,
          "^": 4,
          "&": 5,
          "==": 6,
          "!=": 6,
          "<": 7,
          ">": 7,
          "<=": 7,
          ">=": 7,
          instanceof: 7,
          "<<": 8,
          ">>": 8,
          ">>>": 8,
          "+": 9,
          "-": 9,
          "*": 10,
          "/": 10,
          "%": 10,
        };
        const STMT_EXPRS = new Set([
          "Assign",
          "CompoundAssign",
          "PreInc",
          "PostInc",
          "Call",
          "New",
          "CtorCall",
          "SuperCall",
        ]);
        const LVALUES = new Set(["Name", "Field", "Index"]);

        function tokDisplay(t) {
          if (t.t === "eof") return "fim do código";
          if (t.t === "str") return JSON.stringify(t.v);
          if (t.t === "char") return "'" + String.fromCharCode(t.v) + "'";
          return String(t.v);
        }

        class Parser {
          constructor(toks) {
            this.toks = toks;
            this.p = 0;
            this.gtDebt = 0;
          }
          get tok() {
            return this.toks[this.p];
          }
          peek(k = 1) {
            return this.toks[Math.min(this.p + k, this.toks.length - 1)];
          }
          is(v) {
            const t = this.toks[this.p];
            return (t.t === "op" || t.t === "kw") && t.v === v;
          }
          isAt(k, v) {
            const t = this.peek(k);
            return (t.t === "op" || t.t === "kw") && t.v === v;
          }
          accept(v) {
            if (this.is(v)) {
              this.p++;
              return true;
            }
            return false;
          }
          fail(m, line) {
            throw CE(m, line === undefined ? this.tok.line : line);
          }
          expect(v, ctx) {
            if (this.is(v)) return this.toks[this.p++];
            const t = this.tok;
            if (t.v === "->" && t.t === "op")
              this.fail(
                "expressões lambda (->) não são suportadas neste ambiente",
              );
            const prevLine = this.p > 0 ? this.toks[this.p - 1].line : t.line;
            const line = v === ";" ? prevLine : t.line;
            this.fail(
              `esperado '${v}'${ctx ? " " + ctx : ""}, mas foi encontrado '${tokDisplay(t)}'`,
              line,
            );
          }
          ident(what) {
            const t = this.tok;
            if (t.t !== "id")
              this.fail(
                `esperado ${what || "um identificador (nome)"}, mas foi encontrado '${tokDisplay(t)}'` +
                  (t.t === "kw" ? ` ('${t.v}' é palavra reservada)` : ""),
              );
            this.p++;
            return t.v;
          }
          save() {
            return [this.p, this.gtDebt];
          }
          restore(s) {
            this.p = s[0];
            this.gtDebt = s[1];
          }

          parseUnit() {
            const classes = [],
              imports = [];
            if (this.accept("package")) {
              while (!this.is(";") && this.tok.t !== "eof") this.p++;
              this.expect(";");
            }
            while (this.is("import")) {
              this.p++;
              let name = "";
              while (!this.is(";")) {
                if (this.tok.t === "eof") this.fail("esperado ';' no import");
                name += this.tok.v + (this.tok.v === "static" ? " " : "");
                this.p++;
              }
              this.p++;
              imports.push(name);
            }
            while (this.tok.t !== "eof") {
              if (this.accept(";")) continue;
              if (this.is("import"))
                this.fail("import deve aparecer antes das classes");
              classes.push(this.parseTypeDecl(this.parseModifiers()));
            }
            return { classes, imports };
          }
          skipParens() {
            let d = 0;
            do {
              if (this.is("(")) d++;
              else if (this.is(")")) d--;
              if (this.tok.t === "eof") this.fail("faltou ')'");
              this.p++;
            } while (d > 0);
          }
          parseModifiers() {
            const m = new Set();
            for (;;) {
              if (this.is("@") && !this.isAt(1, "interface")) {
                this.p++;
                this.ident();
                while (this.accept(".")) this.ident();
                if (this.is("(")) this.skipParens();
                continue;
              }
              const t = this.tok;
              if (t.t === "kw" && MODS.has(t.v)) {
                if (
                  t.v === "default" &&
                  (this.isAt(1, ":") || this.isAt(1, "->"))
                )
                  break;
                m.add(t.v);
                this.p++;
                continue;
              }
              if (
                t.t === "id" &&
                t.v === "sealed" &&
                (this.peek().t === "kw" || this.peek().t === "id")
              ) {
                this.p++;
                continue;
              }
              break;
            }
            return m;
          }
          parseTypeDecl(mods) {
            const line = this.tok.line;
            let kind;
            if (this.accept("class")) kind = "class";
            else if (this.accept("interface")) kind = "interface";
            else if (this.is("enum"))
              this.fail("enum não é suportado neste ambiente");
            else if (this.tok.t === "id" && this.tok.v === "record")
              this.fail("record não é suportado neste ambiente");
            else
              this.fail(
                `esperado 'class' ou 'interface', mas foi encontrado '${tokDisplay(this.tok)}'` +
                  ((this.tok.t === "kw" &&
                    ["void", "int", "static"].includes(this.tok.v)) ||
                  this.tok.t === "id"
                    ? " — métodos e atributos devem ficar dentro de uma classe"
                    : ""),
              );
            const name = this.ident("o nome da classe");
            let typeParams = [];
            if (this.is("<")) typeParams = this.parseTypeParams();
            let superName = null;
            const interfaces = [];
            if (this.accept("extends")) {
              if (kind === "interface") {
                interfaces.push(this.parseType().name);
                while (this.accept(",")) interfaces.push(this.parseType().name);
              } else {
                superName = this.parseType().name;
                if (this.is(","))
                  this.fail(
                    "Java não permite herança múltipla de classes (use interfaces)",
                  );
              }
            }
            if (this.accept("implements")) {
              interfaces.push(this.parseType().name);
              while (this.accept(",")) interfaces.push(this.parseType().name);
            }
            if (this.tok.t === "id" && this.tok.v === "permits") {
              this.p++;
              this.parseType();
              while (this.accept(",")) this.parseType();
            }
            const decl = {
              kind,
              name,
              typeParams,
              superName,
              interfaces,
              fields: [],
              methods: [],
              ctors: [],
              inner: [],
              staticInits: [],
              instInits: [],
              isAbstract: mods.has("abstract") || kind === "interface",
              isStatic: mods.has("static") || kind === "interface",
              isPublic: mods.has("public"),
              line,
            };
            this.expect("{", `para abrir a classe ${name}`);
            while (!this.accept("}")) {
              if (this.tok.t === "eof")
                this.fail(
                  `o código terminou antes de fechar a classe ${name}: falta '}'`,
                );
              this.parseMember(decl);
            }
            return decl;
          }
          parseTypeParams() {
            this.p++;
            const names = [];
            do {
              names.push(this.ident());
              if (this.accept("extends")) {
                this.parseType();
                while (this.accept("&")) this.parseType();
              }
            } while (this.accept(","));
            if (!this.closeGt()) this.fail("esperado '>'");
            return names;
          }
          closeGt() {
            if (this.gtDebt > 0) {
              this.gtDebt--;
              return true;
            }
            if (this.is(">")) {
              this.p++;
              return true;
            }
            if (this.is(">>")) {
              this.p++;
              this.gtDebt += 1;
              return true;
            }
            if (this.is(">>>")) {
              this.p++;
              this.gtDebt += 2;
              return true;
            }
            return false;
          }
          parseTypeArgs() {
            this.p++;
            if (this.closeGt()) return;
            do {
              if (this.accept("?")) {
                if (this.accept("extends") || this.accept("super"))
                  this.parseType();
              } else this.parseType();
            } while (this.accept(","));
            if (!this.closeGt())
              this.fail(
                `esperado '>' para fechar o tipo genérico, mas foi encontrado '${tokDisplay(this.tok)}'`,
              );
          }
          parseType() {
            const t = this.tok,
              line = t.line;
            let name;
            if (t.t === "kw" && PRIMS.has(t.v)) {
              name = t.v;
              this.p++;
            } else if (t.t === "id") {
              name = this.ident();
              if (this.is("<")) this.parseTypeArgs();
              while (this.is(".") && this.peek().t === "id") {
                this.p++;
                name = this.ident();
                if (this.is("<")) this.parseTypeArgs();
              }
            } else
              this.fail(
                `esperado um tipo, mas foi encontrado '${tokDisplay(t)}'`,
              );
            let dims = 0;
            while (this.is("[") && this.isAt(1, "]")) {
              this.p += 2;
              dims++;
            }
            return { name, dims, line };
          }
          parseMember(decl) {
            if (this.accept(";")) return;
            const line = this.tok.line;
            if (this.is("{")) {
              decl.instInits.push(this.parseBlock());
              return;
            }
            if (this.is("static") && this.isAt(1, "{")) {
              this.p++;
              decl.staticInits.push(this.parseBlock());
              return;
            }
            const mods = this.parseModifiers();
            if (this.is("class") || this.is("interface") || this.is("enum")) {
              decl.inner.push(this.parseTypeDecl(mods));
              return;
            }
            let typeParams = [];
            if (this.is("<")) typeParams = this.parseTypeParams();
            if (
              this.tok.t === "id" &&
              this.tok.v === decl.name &&
              this.isAt(1, "(")
            ) {
              this.p++;
              const params = this.parseParams();
              this.skipThrows();
              if (!this.is("{"))
                this.fail("esperado '{' com o corpo do construtor");
              const body = this.parseBlock();
              decl.ctors.push({
                name: decl.name,
                params,
                body,
                line,
                isCtor: true,
                isPrivate: mods.has("private"),
                typeParams,
              });
              return;
            }
            if (
              this.tok.t === "id" &&
              this.isAt(1, "(") &&
              decl.kind === "class"
            ) {
              this.fail(
                `método '${this.tok.v}' sem tipo de retorno (use void se não retornar nada). Se era para ser um construtor, o nome deve ser igual ao da classe: ${decl.name}`,
              );
            }
            let retType;
            if (this.accept("void")) retType = { name: "void", dims: 0, line };
            else retType = this.parseType();
            const name = this.ident("o nome do atributo ou método");
            if (this.is("(")) {
              const params = this.parseParams();
              while (this.accept("[")) {
                this.expect("]");
                retType = { name: retType.name, dims: retType.dims + 1, line };
              }
              this.skipThrows();
              let body = null;
              if (this.is("{")) body = this.parseBlock();
              else {
                if (!this.is(";"))
                  this.fail(
                    `esperado '{' para abrir o corpo do método ${name}, mas foi encontrado '${tokDisplay(this.tok)}'`,
                  );
                this.p++;
              }
              const isStatic = mods.has("static");
              if (
                !body &&
                decl.kind === "class" &&
                !mods.has("abstract") &&
                !mods.has("native")
              )
                this.fail(`o método ${name} precisa de um corpo { ... }`, line);
              if (body && mods.has("abstract"))
                this.fail(`método abstrato ${name} não pode ter corpo`, line);
              decl.methods.push({
                name,
                params,
                retType,
                body,
                isStatic,
                isAbstract: !body,
                isPrivate: mods.has("private"),
                line,
                typeParams,
              });
              return;
            }
            if (retType.name === "void")
              this.fail(`atributo '${name}' não pode ser do tipo void`, line);
            const isStatic = mods.has("static") || decl.kind === "interface";
            let n = name;
            for (;;) {
              let type = retType;
              while (this.accept("[")) {
                this.expect("]");
                type = { name: type.name, dims: type.dims + 1, line };
              }
              let init = null;
              if (this.accept("="))
                init = this.is("{")
                  ? this.parseArrayInit(type)
                  : this.parseExpr();
              decl.fields.push({
                name: n,
                type,
                init,
                isStatic,
                isPrivate: mods.has("private"),
                isFinal: mods.has("final"),
                line,
              });
              if (this.accept(",")) {
                n = this.ident();
                continue;
              }
              this.expect(";", "após a declaração do atributo");
              break;
            }
          }
          parseParams() {
            this.expect("(");
            const params = [];
            if (!this.is(")")) {
              do {
                this.parseModifiers();
                let type = this.parseType();
                let varargs = false;
                if (this.accept("...")) {
                  type = {
                    name: type.name,
                    dims: type.dims + 1,
                    line: type.line,
                  };
                  varargs = true;
                }
                const name = this.ident("o nome do parâmetro");
                while (this.accept("[")) {
                  this.expect("]");
                  type = {
                    name: type.name,
                    dims: type.dims + 1,
                    line: type.line,
                  };
                }
                params.push({ name, type, varargs });
              } while (this.accept(","));
            }
            this.expect(")", "para fechar a lista de parâmetros");
            return params;
          }
          skipThrows() {
            if (this.accept("throws")) {
              this.parseType();
              while (this.accept(",")) this.parseType();
            }
          }

          parseBlock() {
            const line = this.tok.line;
            this.expect("{");
            const body = [];
            while (!this.accept("}")) {
              if (this.tok.t === "eof")
                this.fail(
                  "o código terminou antes de fechar um bloco: falta '}'",
                  line,
                );
              body.push(this.parseStatement());
            }
            return { type: "Block", body, line };
          }
          parseStatement() {
            const t = this.tok,
              line = t.line;
            if (this.is("{")) return this.parseBlock();
            if (this.accept(";")) return { type: "Empty", line };
            if (t.t === "kw") {
              switch (t.v) {
                case "if": {
                  this.p++;
                  this.expect("(", "após 'if'");
                  const cond = this.parseExpr();
                  this.expect(")", "para fechar a condição do if");
                  const then = this.parseStatement();
                  let els = null;
                  if (this.accept("else")) els = this.parseStatement();
                  return { type: "If", cond, then, els, line };
                }
                case "while": {
                  this.p++;
                  this.expect("(", "após 'while'");
                  const cond = this.parseExpr();
                  this.expect(")", "para fechar a condição do while");
                  return {
                    type: "While",
                    cond,
                    body: this.parseStatement(),
                    line,
                  };
                }
                case "do": {
                  this.p++;
                  const body = this.parseStatement();
                  this.expect("while", "no do-while");
                  this.expect("(");
                  const cond = this.parseExpr();
                  this.expect(")");
                  this.expect(";");
                  return { type: "DoWhile", cond, body, line };
                }
                case "for":
                  return this.parseFor();
                case "return": {
                  this.p++;
                  let e = null;
                  if (!this.is(";")) e = this.parseExpr();
                  this.expect(";");
                  return { type: "Return", expr: e, line };
                }
                case "break": {
                  this.p++;
                  let label = null;
                  if (this.tok.t === "id") label = this.ident();
                  this.expect(";");
                  return { type: "Break", label, line };
                }
                case "continue": {
                  this.p++;
                  let label = null;
                  if (this.tok.t === "id") label = this.ident();
                  this.expect(";");
                  return { type: "Continue", label, line };

                case "throw": {
                  this.p++;
                  const e = this.parseExpr();
                  this.expect(";");
                  return { type: "Throw", expr: e, line };
                }
                case "try":
                  return this.parseTry();
                case "switch":
                  return this.parseSwitch();

                case "interface":
                case "enum":
                  this.fail(
                    "classes locais (declaradas dentro de métodos) não são suportadas",

                  return this.parseLocalVarDecl();
                case "assert": {
                  this.p++;
                  const cond = this.parseExpr();
                  let msg = null;
                  if (this.accept(":")) msg = this.parseExpr();
                  this.expect(";");
                  return { type: "Assert", cond, msg, line };
                }
                case "else":
                  this.fail(
                    "'else' sem um 'if' correspondente (verifique chaves e ponto e vírgula antes do else)",
                  );

                case "default":

                case "public":
                case "private":
                case "protected":

            if (this.is("@")) return this.parseLocalVarDecl();

              this.p += 2;
              const s = this.parseStatement();
              s.label = t.v;
              return s;

            const e = this.parseExpr();
            if (!STMT_EXPRS.has(e.type))

                "isto não é uma instrução válida (not a statement). Talvez falte uma atribuição ou chamada de método",

          isLocalVarDeclStart() {
            const t = this.tok;

            try {
              this.parseType();
              return (
                this.gtDebt === 0 &&
                this.tok.t === "id" &&
                ["=", ";", ",", "[", ":"].some((v) => this.isAt(1, v))

          parseLocalVarDeclNoSemi() {

            const decls = [];
            do {
              const name = this.ident("o nome da variável");
              let type = base;
              while (this.accept("[")) {
                this.expect("]");
                type = { name: type.name, dims: type.dims + 1, line };
              }
              let init = null;
              if (this.accept("=")) {
                if (this.is("{")) {
                  if (type.dims === 0)
                    this.fail(
                      `inicializador { ... } só pode ser usado com arrays`,
                    );
                  init = this.parseArrayInit(type);
                } else init = this.parseExpr();
              }
              if (type.name === "var" && !init)
                this.fail("'var' exige inicialização");

                name,
                type,
                init,
                line: this.toks[this.p - 1].line,

          parseLocalVarDecl() {

            this.expect(";", "após a declaração da variável");
            return d;

          parseFor() {
            const line = this.tok.line;
            this.p++;
            this.expect("(", "após 'for'");

            let isEach = false;
            try {
              this.parseModifiers();
              this.parseType();
              this.ident();
              isEach = this.is(":") && this.gtDebt === 0;
            } catch (e) {
              if (!(e instanceof CompileError)) throw e;
            }
            this.restore(s);
            if (isEach) {
              this.parseModifiers();
              const varType = this.parseType();
              const name = this.ident();
              this.expect(":");
              const iter = this.parseExpr();
              this.expect(")");
              const body = this.parseStatement();
              return { type: "ForEach", varType, name, iter, body, line };
            }
            let init = [];
            if (!this.is(";")) {
              if (this.is("final") || this.isLocalVarDeclStart())
                init = [this.parseLocalVarDeclNoSemi()];
              else {
                do {
                  const e = this.parseExpr();
                  init.push({ type: "ExprStmt", expr: e, line: e.line });
                } while (this.accept(","));

              ";",
              "na declaração do for (separe as três partes com ;)",
            );
            let cond = null;
            if (!this.is(";")) cond = this.parseExpr();
            this.expect(
              ";",
              "na declaração do for (separe as três partes com ;)",
            );

            if (!this.is(")")) {
              do update.push(this.parseExpr());
              while (this.accept(","));

            return { type: "For", init, cond, update, body, line };

            let fin = null;
            while (this.is("catch")) {
              const cl = this.tok.line;
              this.p++;
              this.expect("(");
              this.parseModifiers();
              const types = [this.parseType().name];
              while (this.accept("|")) types.push(this.parseType().name);
              const name = this.ident();
              this.expect(")");
              catches.push({ types, name, body: this.parseBlock(), line: cl });

          parseSwitch() {

              if (this.accept("default")) isDefault = true;

                this.expect("case");
                labels.push(this.parseTernary());
                while (this.accept(",")) labels.push(this.parseTernary());

              if (this.accept("->")) {
                let body;
                if (this.is("{")) body = [this.parseBlock()];
                else if (this.is("throw")) body = [this.parseStatement()];

                  const e = this.parseExpr();
                  this.expect(";");
                  body = [{ type: "ExprStmt", expr: e, line: cline }];
                }
                cases.push({
                  labels,
                  isDefault,
                  body,
                  arrow: true,
                  line: cline,

                this.expect(":", "após o case");

                while (
                  !this.is("case") &&
                  !this.is("default") &&
                  !this.is("}")

                  if (this.tok.t === "eof")
                    this.fail("falta '}' para fechar o switch", line);
                  body.push(this.parseStatement());
                }
                cases.push({
                  labels,
                  isDefault,
                  body,
                  arrow: false,
                  line: cline,
                });

          parseExpr() {
            return this.parseAssign();

          parseAssign() {
            const lhs = this.parseTernary();
            const t = this.tok;
            if (t.t === "op" && ASSIGN_OPS.has(t.v)) {
              this.p++;
              if (!LVALUES.has(lhs.type))
                this.fail(
                  "o lado esquerdo da atribuição não é uma variável",
                  t.line,
                );
              if (this.is("{"))
                this.fail(
                  "inicializador { ... } só é permitido na declaração (use new tipo[]{ ... })",
                );
              const rhs = this.parseAssign();
              if (t.v === "=")
                return {
                  type: "Assign",
                  target: lhs,
                  value: rhs,
                  line: t.line,
                };
              return {
                type: "CompoundAssign",
                op: t.v.slice(0, -1),
                target: lhs,
                value: rhs,
                line: t.line,
              };

          parseTernary() {
            const c = this.parseBin(0);

              const line = this.tok.line;
              this.p++;
              const a = this.parseTernary();
              this.expect(":", "no operador ternário ? :");

          parseBin(minPrec) {

              const t = this.tok;

              if (prec === undefined || prec <= minPrec) break;

                  expr: left,
                  ty,
                  bind,
                  line: t.line,

                        "this",
                        "new",
                        "super",
                        "true",
                        "false",
                        "null",

                    (nx.t === "op" && ["(", "!", "~"].includes(nx.v));

                if (this.is("class"))
                  this.fail(".class não é suportado neste ambiente");

                  e = { type: "This", line: t.line };

                const name = this.ident(

                    name,
                    args: this.parseArgs(),

                this.p++;
                const idx = this.parseExpr();
                this.expect("]");
                e = { type: "Index", arr: e, idx, line: t.line };
                continue;
              }
              if (this.is("++") || this.is("--")) {
                if (!LVALUES.has(e.type))
                  this.fail(`'${t.v}' só pode ser aplicado a variáveis`);
                this.p++;
                e = { type: "PostInc", op: t.v, target: e, line: t.line };
                continue;

                this.fail("referências a métodos (::) não são suportadas");

              while (this.accept(","));

            return args;

          parsePrimary() {
            const t = this.tok,
              line = t.line;
            switch (t.t) {
              case "int":
                this.p++;
                return { type: "Lit", value: t.v, line };
              case "double":
                this.p++;
                return { type: "Lit", value: mkDouble(t.v), line };
              case "char":
                this.p++;
                return { type: "Lit", value: mkChar(t.v), line };
              case "str":
                this.p++;
                return { type: "Lit", value: t.v, line };
              case "id":
                this.p++;
                if (this.is("("))
                  return {
                    type: "Call",
                    obj: null,
                    name: t.v,
                    args: this.parseArgs(),

                return { type: "Name", name: t.v, line };

                  case "false":

                    return { type: "Lit", value: null, line };

                        kind: "this",
                        args: this.parseArgs(),
                        line,

                    return { type: "This", line };

                        type: "CtorCall",
                        kind: "super",
                        args: this.parseArgs(),
                        line,

                        type: "SuperCall",
                        name,
                        args: this.parseArgs(),

                      obj: { type: "This", line },
                      name,
                      line,

                      "expressões lambda (->) não são suportadas neste ambiente",

                    "inicializador { ... } só pode ser usado na declaração de um array",

            this.fail(`expressão inválida: '${tokDisplay(t)}' inesperado`);

        /* ----------------------------- Prelúdio --------------------------- */
        const PRELUDE_EX = [
          ["Exception", "Throwable"],
          ["Error", "Throwable"],
          ["RuntimeException", "Exception"],
          ["IllegalStateException", "RuntimeException"],
          ["IllegalArgumentException", "RuntimeException"],
          ["NullPointerException", "RuntimeException"],
          ["ArithmeticException", "RuntimeException"],
          ["IndexOutOfBoundsException", "RuntimeException"],
          ["ArrayIndexOutOfBoundsException", "IndexOutOfBoundsException"],
          ["StringIndexOutOfBoundsException", "IndexOutOfBoundsException"],
          ["ClassCastException", "RuntimeException"],
          ["NumberFormatException", "IllegalArgumentException"],
          ["UnsupportedOperationException", "RuntimeException"],
          ["NegativeArraySizeException", "RuntimeException"],
          ["NoSuchElementException", "RuntimeException"],
          ["EmptyStackException", "RuntimeException"],
          ["IllegalFormatConversionException", "IllegalArgumentException"],
          ["InputMismatchException", "NoSuchElementException"],
          ["ConcurrentModificationException", "RuntimeException"],
          ["StackOverflowError", "Error"],
          ["OutOfMemoryError", "Error"],
          ["AssertionError", "Error"],
          ["InterruptedException", "Exception"],
          ["CloneNotSupportedException", "Exception"],
          ["IOException", "Exception"],

        let PRELUDE_SRC =
          "class Throwable { String message; Throwable cause; Throwable() {} Throwable(String message) { this.message = message; } Throwable(String message, Throwable cause) { this.message = message; this.cause = cause; } Throwable(Throwable cause) { this.cause = cause; if (cause != null) this.message = cause.toString(); } String getMessage() { return message; } String getLocalizedMessage() { return message; } Throwable getCause() { return cause; } }\n";
        for (const [n, p] of PRELUDE_EX)
          PRELUDE_SRC += `class ${n} extends ${p} { ${n}() { super(); } ${n}(String message) { super(message); } ${n}(String message, Throwable cause) { super(message, cause); } ${n}(Throwable cause) { super(cause); } }\n`;
        let PRELUDE_AST = null;

        /* ---------------------------- Utilidades -------------------------- */
        function fmtDouble(d) {
          if (Number.isNaN(d)) return "NaN";
          if (d === Infinity) return "Infinity";
          if (d === -Infinity) return "-Infinity";
          if (d === 0) return Object.is(d, -0) ? "-0.0" : "0.0";
          const a = Math.abs(d);
          if (a >= 1e7 || a < 1e-3) {
            let s = d.toExponential();
            let [m, e] = s.split("e");
            if (!m.includes(".")) m += ".0";
            return m + "E" + (e[0] === "+" ? e.slice(1) : e);
          }
          const s = String(d);
          return s.includes(".") ? s : s + ".0";
        }
        function hex(id) {
          return ((Math.imul(id, 2654435761) >>> 0) % 0x7fffffff).toString(16);
        }
        function wrapInt(t, v) {
          if (t === "int") return v | 0;
          if (t === "short") return (v << 16) >> 16;
          if (t === "byte") return (v << 24) >> 24;
          return v;
        }
        function truncD(d, t) {
          if (Number.isNaN(d)) return 0;

            if (d <= -9223372036854775808) return -9223372036854775808;
            return Math.trunc(d);

          if (d >= 2147483647) return 2147483647;
          if (d <= -2147483648) return -2147483648;
          return wrapInt(t, Math.trunc(d));
        }
        const isNum = (v) =>
          typeof v === "number" || v instanceof JDouble || v instanceof JChar;
        const numVal = (v) =>
          typeof v === "number" ? v : v instanceof JDouble ? v.v : v.c;
        function cmpStr(a, b) {
          const n = Math.min(a.length, b.length);
          for (let i = 0; i < n; i++) {
            const d = a.charCodeAt(i) - b.charCodeAt(i);
            if (d) return d;
          }
          return a.length - b.length;
        }
        function strHash(s) {
          let h = 0;
          for (let i = 0; i < s.length; i++)
            h = (Math.imul(31, h) + s.charCodeAt(i)) | 0;
